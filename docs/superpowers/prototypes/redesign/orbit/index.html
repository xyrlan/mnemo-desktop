<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mnemo · orbit</title>
<link rel="stylesheet" href="../base/base.css">
<link rel="stylesheet" href="orbit.css">
</head>
<body>
<div id="app" data-view="scene">
  <!-- drawn once per size, never animated -->
  <canvas id="stars" data-asset="starfield" aria-hidden="true"></canvas>

  <!-- the scene: everything positioned in window pixels, so it can yield as one piece -->
  <main id="scene" aria-label="Sessions in orbit">
    <svg id="chart" aria-hidden="true"></svg>
    <div id="core" data-asset="memory-core" role="button" tabindex="-1" aria-label="Open memory"></div>
    <div id="leaders" aria-hidden="true"></div>
    <div id="bodies"></div>
    <div id="labels"></div>
    <div id="motes" aria-hidden="true"></div>
  </main>
  <div id="card" hidden></div>

  <section id="station" aria-label="Session" hidden></section>
  <section id="vault" aria-label="Memory" hidden></section>

  <header id="fleet"></header>
  <footer id="keys"></footer>
  <div id="finder" hidden></div>
  <div id="lightbox" hidden></div>
</div>

<script src="../base/load.js"></script>
<script src="js/model.js"></script>
<script src="js/layout.js"></script>
<script src="js/scene.js"></script>
<script src="js/station.js"></script>
<script src="js/vault.js"></script>
<script src="js/app.js"></script>
</body>
</html>
