  for (const t of active) {
    const inRoom = RM.map(() => [])
    for (const stn of t.stations) for (const r of stn.crew) {
      if (r.s.st === 'need') needs.push(r)
      else inRoom[RIDX[place(r.s)]].push(r)
    }
    // the hangar keeps working robots and the newest finished ones; the rest wait in a stack
    const hg = inRoom[HG]
    const hgWork = hg.filter((r) => r.s.st !== 'done'), hgDone = hg.filter((r) => r.s.st === 'done').sort((a, b) => b.c.last - a.c.last)
    const room4 = Math.max(1, perRows[HG] * 2 - hgWork.length - 1)
    let stack = null
    if (!openStacks.has(t.repo) && hgDone.length > room4 + 1) {
      const hidden = hgDone.slice(room4)
      stack = { repo: t.repo, hidden, n: hidden.length, green: hidden.filter((r) => r.s.ci === 'green').length }
      for (const r of hidden) stackedIds.add(r.c.id)
      inRoom[HG] = [...hgWork, ...hgDone.slice(0, room4)]
    } else if (openStacks.has(t.repo) && hgDone.length > room4 + 1) {
      stack = { repo: t.repo, hidden: [], n: hgDone.length, open: true }
    }
    const slots = inRoom.map((a, ri) => a.length + (ri === HG && stack ? 2 : 0))
    const rows = Math.max(1, ...slots.map((n, ri) => Math.ceil(n / perRows[ri])))
    const big = t.stations.length <= (G.cmdW >= 250 ? 2 : 1)
    const cmdH = 28 + (big ? 172 : Math.ceil(t.stations.length / 3) * 104) + (t.quiet.length ? 34 : 0)
    const h = Math.max(G.labelH + G.bubbleH + rows * G.rowH + 4, cmdH)
    const ready = inRoom[HG].some((r) => r.s.st === 'done' && r.s.ci === 'green') || (stack && stack.green > 0)
    decks.push({ t, y, h, inRoom, big, ready })
    t.stations.forEach((stn, k) => {
      const x = big ? G.pad + 14 + k * 122 : G.pad + 6 + (k % 3) * 84
      const ny = big ? y + 26 : y + 24 + Math.floor(k / 3) * 104
      wantN.set(stn.p.id, { stn, x, y: ny, small: !big })
    })
    inRoom.forEach((arr, ri) => {
      const rx = roomXs[ri], pr = perRows[ri]
      arr.forEach((r, i) => wantR.set(r.c.id, { r, x: rx + 8 + (i % pr) * G.slotW, y: y + G.labelH + G.bubbleH + Math.floor(i / pr) * G.rowH }))
      rooms.set(`${t.repo}:${RM[ri].key}`, { arr, x: rx, y, w: roomWs[ri] })
      if (ri === HG && stack) {
        const i = arr.length
        wantS.set(t.repo, { ...stack, x: rx + 8 + (i % pr) * G.slotW, y: y + G.labelH + G.bubbleH + Math.floor(i / pr) * G.rowH })
      }
    })
    y += h + G.gap
  }
  const needX = ATTN && listRows ? G.pad + Math.max(560, W * 0.6) : G.pad + 150
  needs.forEach((r, j) => wantR.set(r.c.id, { r, x: needX + j * 270, y: G.pad + bridgeH - 100, bridge: true }))
  const docksY = y
  const totalH = docksY + (quietRepos.length ? 90 : 20) + 60

  // static structure: bridge, column heads, decks, docks
  const sig = JSON.stringify([LAYOUT, W, bridgeH, decks.map((d) => [d.t.repo, d.y, d.h, d.t.quiet.map((q) => q.p.id), d.inRoom.map((a) => a.length), d.ready]), quietRepos.map((t) => [t.repo, t.quiet.map((q) => q.p.id)])])
  if (sig !== bgSig) {
    bgSig = sig
    stInner.style.height = `${totalH}px`; stInner.style.width = `${W + 2 * G.pad}px`
    stBg.innerHTML = `
      <div class="bridge ${counts.need || exc.some((e) => e.kind === 'need' || e.kind === 'red') ? 'alert' : exc.length ? 'calm-alert' : ''}" style="left:${G.pad}px;top:${G.pad}px;width:${W}px;height:${bridgeH}px">
        <div class="blabel">${ATTN ? 'BRIDGE · exceptions' : 'BRIDGE · you'}</div>
        <div class="bstatus">${ATTN ? (exc.length ? `${exc.length} thing${exc.length > 1 ? 's wait' : ' waits'} for you` : 'nothing needs you ✓ — the fleet flies itself') : counts.need ? `${counts.need} child${counts.need > 1 ? 'ren' : ''} came up here and wait${counts.need > 1 ? '' : 's'} for you` : 'nobody needs you ✓ — whoever gets stuck climbs up here'}</div>
        ${counts.need ? '<button class="attend" data-attend>attend · Tab</button>' : ''}
        <div class="console"><i></i><i></i><i></i></div>
      </div>
      <div class="colhead" style="left:${G.pad}px;top:${G.pad + bridgeH + G.gap}px;width:${W}px">
        <div style="width:${G.cmdW}px">COMMAND <small>parents</small></div>
        ${RM.map((rm, ri) => `<div style="width:${roomWs[ri]}px">${rm.label} <small>${rm.hint}</small></div>`).join('')}
      </div>
      ${decks.map((d) => `<div class="deck" style="left:${G.pad}px;top:${d.y}px;width:${W}px;height:${d.h}px">
        <div class="cmd" style="width:${G.cmdW}px"><div class="dlabel">${esc(d.t.repo)}</div>
          ${d.t.quiet.length ? `<div class="quietrow">${d.t.quiet.map((q) => `<button class="qchip" data-id="${q.p.id}" title="idle · ${esc(q.s.topic ? q.s.topic.t.slice(0, 160) : '')}"><img src="${SP}captain-idle.png" alt="">${esc(q.p.name)}</button>`).join('')}</div>` : ''}
        </div>
        ${RM.map((rm, ri) => `<div class="room room-${rm.key} ${d.inRoom[ri].length ? 'lit' : ''} ${ri === HG && d.ready ? 'ready' : ''}" style="left:${roomXs[ri] - G.pad}px;width:${roomWs[ri]}px">${d.inRoom[ri].length ? `<span class="rcount">${d.inRoom[ri].length}</span>` : ''}</div>`).join('')}
      </div>`).join('')}
      ${quietRepos.length ? `<div class="docks" style="left:${G.pad}px;top:${docksY}px;width:${W}px"><b>DOCKS</b>${quietRepos.map((t) => `<div class="pod"><span>${esc(t.repo)}</span>${t.quiet.map((q) => `<button class="qchip" data-id="${q.p.id}" title="${esc(q.s.topic ? q.s.topic.t.slice(0, 160) : '')}"><img src="${SP}captain-idle.png" alt="">${esc(q.p.name)}</button>`).join('')}</div>`).join('')}</div>` : ''}`
  }

  // the bridge's own prompt: orders for the whole fleet
  let bcmd = $('#bridge-cmd')
  if (!bcmd) {
    bcmd = document.createElement('div'); bcmd.id = 'bridge-cmd'
    bcmd.innerHTML = `<div class="row"><span>›</span><input placeholder="orders for the fleet (key /)…   /dispatch mnemo #123   ·   /msg #682 text   ·   /msg all text"></div>
      <div class="hint"><code>/dispatch &lt;repo&gt; #&lt;issue&gt;</code> dispatches a child · <code>/msg &lt;#issue | captain | all&gt; &lt;text&gt;</code> · <code>/merge green</code> · <code>/stop all</code> · shift+click selects several</div><div class="out"></div>`
    stInner.appendChild(bcmd)
    $('input', bcmd).addEventListener('keydown', (ev) => { if (ev.key === 'Enter' && ev.target.value.trim()) { bridgeCommand(ev.target.value); ev.target.value = '' } })
  }
  bcmd.style.transform = `translate(${G.pad + 16}px, ${G.pad + 30}px)`
  bcmd.style.width = `${Math.max(420, Math.min(860, W - 330))}px`
  let blist = $('#bridge-list')
  if (!blist) { blist = document.createElement('div'); blist.id = 'bridge-list'; stInner.appendChild(blist) }
  blist.style.display = exc.length ? '' : 'none'
  blist.style.transform = `translate(${G.pad + 16}px, ${G.pad + 96}px)`
  blist.style.width = `${counts.need ? Math.min(needX - G.pad - 40, 900) : Math.min(W - 32, 1100)}px`
  if (exc.length) {
    const green = exc.filter((e) => e.kind === 'ready').length
    const html = `<div class="xhead">exceptions <small>— everything else flies itself</small>${green > 1 ? `<button data-x="mergeall" class="go">${mergeAllArmed ? `confirm merge of ${green}?` : `✈ merge all green (${green})`}</button>` : ''}</div>
      ${exc.slice(0, 6).map((e, k) => `<div class="xrow ${e.kind}" data-xopen="${e.id}"><kbd class="xn" title="⌥${k + 1} opens it in the drawer (in the app: ⌘${k + 1})">⌥${k + 1}</kbd><span class="xi">${e.icon}</span><b>${robotTag(byId.get(e.id))}</b><span class="xt">${esc(e.text)}</span>${e.btns.map(([k, label]) => `<button data-x="${k}" data-xid="${e.id}">${label}</button>`).join('')}</div>`).join('')}
      ${exc.length > 6 ? `<div class="xmore">+${exc.length - 6} exceptions</div>` : ''}`
    if (blist._h !== html) { blist.innerHTML = html; blist._h = html }
  }

  // nexuses
  for (const [id, w] of wantN) {
    let el = nodesN.get(id)
    if (!el) { el = document.createElement('div'); el.dataset.id = id; el.style.opacity = 0; stInner.appendChild(el); nodesN.set(id, el); requestAnimationFrame(() => (el.style.opacity = 1)) }
    const { p, s, need } = w.stn
    const cls = `snexus ${s.st} ${need ? 'has-need' : ''} ${w.small ? 'small' : ''} ${id === focusId() ? 'focus' : ''}`
    if (el._cls !== cls) { el.className = cls; el._cls = cls }
    el.style.transform = `translate(${w.x}px, ${w.y}px)`
    const mail = recentMail(p, T)
    const pact = s.st === 'busy' ? (s.tool && (!s.say || s.tool.at >= s.say.at) ? human(s.tool) : s.say ? '💬 ' + firstSentence(s.say.t, 80) : '') : ''
    const html = `<div class="ring"></div><img class="sprite" src="${captainSrc(p, s.st, need)}" alt="">
      ${mail ? `<div class="mail" title="notices from children (30 min)">✉ ${mail}</div>` : ''}
      <div class="name"><span class="em">${emblemOf.get(p.id) || ''}</span> ${esc(p.name)}</div>
      <div class="topic">${p.orphan ? 'children with no recorded parent' : s.topic ? '“' + esc(s.topic.t.slice(0, 80)) + '”' : ''}</div>
      ${pact ? `<div class="pact">${esc(pact)}</div>` : ''}`
    if (el._html !== html) { el.innerHTML = html; el._html = html }
  }
  for (const [id, el] of nodesN) if (!wantN.has(id)) { el.style.opacity = 0; nodesN.delete(id); setTimeout(() => el.remove(), 900) }

  // robots: walk to their room; newcomers step out of their nexus; leavers fly off past the hangar
  for (const [id, w] of wantR) {
    const { c, s } = w.r
    let el = nodesR.get(id), born = false
    if (!el) {
      el = document.createElement('div'); el.dataset.id = id; el.title = c.title
      el.innerHTML = `<div class="needslot"></div><img class="ship" src="${SP}ship-docked.png" alt=""><div class="halo"></div><img class="acc" src="${SP}accessory-${hash(c.id) % 6}.png" alt=""><img class="body" alt=""><div class="fx"></div><div class="ab"></div><div class="tag"></div>`
      const home = wantN.get(c.station), pile = wasStacked.has(id) && wantS.get(c.repo)
      const sx = pile ? pile.x : home ? home.x + 16 : w.x, sy = pile ? pile.y : home ? home.y + 20 : w.y
      wasStacked.delete(id)
      el.style.transition = 'none'; el.style.transform = `translate(${sx}px, ${sy}px)`; el._x = sx
      stInner.appendChild(el); nodesR.set(id, el); born = true
      if (spawned.has(id)) {
        const tp = document.createElement('img'); tp.className = 'tele'; tp.src = `${SP}teleport.png`
        tp.style.transform = `translate(${sx}px, ${sy - 30}px)`; stInner.appendChild(tp); setTimeout(() => tp.remove(), 1500)
      }
    }
    const cls = `srobot ${s.st} in-${w.bridge ? 'bridge' : roomOf(s)} ${c.pr ? 'has-pr' : ''} ${s.st === 'done' && s.ci ? 'ci-' + s.ci : ''} ${id === focusId() ? 'focus' : ''} ${sel.has(id) ? 'sel' : ''}`
    const keep = ['flip', 'walk', 'flash', 'dim'].filter((k) => el.classList.contains(k))
    if (el._cls !== cls) { el.className = [cls, ...keep].join(' '); el._cls = cls }
    const pose = s.st === 'idle' && s.idleFor > 600 ? 'sleeping' : robotPose[s.st]
    const src = `${SP}robot-${c.klass}-${pose}.png`
    const body = el.querySelector('.body'); if (body._src !== src) { body.src = src; body._src = src }
    const tag = robotTag(c)
    const tg = el.querySelector('.tag'); if (tg._h !== tag) { tg.innerHTML = tag; tg._h = tag }
    const room = w.bridge ? 'bridge' : roomOf(s)
    const glyph = s.st === 'need' ? '!' : s.st === 'stopped' ? '■' : s.st === 'done' ? ({ red: '✗', run: '⧗', wait: '⧗' }[s.ci] || '✓') : s.st === 'idle' ? (ATTN && zoneOf(s) === 'stuck' ? '⏸' : '…') : s.longRun ? '⧗' : { lib: '⌕', shop: '✎', lab: '⚗', hangar: '⇪', rest: '…' }[room]
    const ab = el.querySelector('.ab'); if (ab._g !== glyph) { ab.textContent = glyph; ab._g = glyph }
    const ns = el.querySelector('.needslot'), nh = s.st === 'need' ? bubbleHTML(c, s, T) : ''
    if (ns._h !== nh) { const typed = $('[data-input]', ns)?.value; ns.innerHTML = nh; ns._h = nh; if (typed) $('[data-input]', ns).value = typed }
    const move = () => {
      if (Math.abs((el._x ?? w.x) - w.x) > 2 || el._y !== w.y) {
        if (el._x != null && Math.abs(el._x - w.x) > 2) { el.classList.toggle('flip', w.x < el._x); el.classList.add('walk'); clearTimeout(el._wt); el._wt = setTimeout(() => el.classList.remove('walk'), 1400) }
        el.style.transform = `translate(${w.x}px, ${w.y}px)`; el._x = w.x; el._y = w.y
      }
    }
    if (born) { void el.offsetWidth; el.style.transition = ''; move() }
    else move()
    const line = robotLine(c, s)
    const prev = said.get(id)
    if (!prev || prev.text !== line.say) said.set(id, { text: line.say, at: performance.now() })
  }
  for (const [id, el] of nodesR) if (!wantR.has(id)) {
    nodesR.delete(id)
    const gone = byId.get(id), m = gone && mergedAtOf(gone)
    if (stackedIds.has(id)) {
      const st = wantS.get(gone.repo)
      el.classList.add('stacking'); if (st) el.style.transform = `translate(${st.x}px, ${st.y}px)`; setTimeout(() => el.remove(), 850)
      wasStacked.add(id)
    } else if (m && T >= m) {
      el.querySelector('.ship').style.transitionDelay = `${Math.random() * 0.7}s`
      const ship = el.querySelector('.ship'); ship.src = `${SP}ship-launch.png`
      el.style.pointerEvents = 'none'; el.classList.add('launch'); setTimeout(() => el.remove(), 2200)
    } else {
      el.classList.add('leaving', 'walk'); el.classList.remove('flip')
      el.style.transform = `translate(${G.pad + W + 40}px, ${el._y ?? 0}px)`; setTimeout(() => el.remove(), 1500)
    }
  }

  for (const [repo, w] of wantS) {
    let el = nodesS.get(repo)
    if (!el) { el = document.createElement('div'); el.className = 'sstack'; el.dataset.stack = repo; stInner.appendChild(el); nodesS.set(repo, el) }
    el.style.transform = `translate(${w.x}px, ${w.y}px)`
    const html = w.open ? `<img src="${SP}ship-docked.png" alt=""><small>−</small><b>fold ${w.n} ready</b>`
      : `<img src="${SP}ship-docked.png" alt=""><img src="${SP}ship-docked.png" alt=""><img src="${SP}ship-docked.png" alt=""><small>+${w.n}</small><b>${w.n} PRs waiting for merge${w.green ? ` · ${w.green} green` : ''}</b>`
    if (el._h !== html) { el.innerHTML = html; el._h = html }
    el.title = w.open ? 'click: stack them again' : `click: open the stack — ${w.hidden.map((r) => r.c.issue).join(' ')}`
  }
  for (const [repo, el] of nodesS) if (!wantS.has(repo)) { el.remove(); nodesS.delete(repo) }

  // voices per room: as many as the room is wide; the freshest lines speak first, the rest take turns
  const now = performance.now(), wantB = new Set()
  for (const [key, room] of rooms) {
    if (!room.arr.length) continue
    const voices = Math.max(1, Math.min(room.arr.length, Math.floor((room.w - 10) / 240)))
    const ids = room.arr.map((x) => x.c.id)
    let cur = (speech.get(key) || []).filter((v) => ids.includes(v.id))
    for (const id of ids) {
      if (cur.some((v) => v.id === id) || now - (said.get(id)?.at || 0) > 3000) continue
      if (cur.length < voices) cur.push({ id, at: now })
      else { cur.sort((p, q) => p.at - q.at); cur[0] = { id, at: now } }
    }
    for (const id of ids) { if (cur.length >= voices) break; if (!cur.some((v) => v.id === id)) cur.push({ id, at: now }) }
    if (ids.length > voices) {
      cur.sort((p, q) => p.at - q.at)
      if (now - cur[0].at > 4500) {
        const last = Math.max(...cur.map((v) => ids.indexOf(v.id)))
        for (let k = 1; k <= ids.length; k++) { const cand = ids[(last + k) % ids.length]; if (!cur.some((v) => v.id === cand)) { cur[0] = { id: cand, at: now }; break } }
      }
    }
    cur = cur.slice(-voices)
    speech.set(key, cur)
    const order = [...cur].sort((p, q) => wantR.get(p.id).x - wantR.get(q.id).x)
    const lane = (room.w - 10) / voices, bw = Math.min(230, lane - 6)
    order.forEach((v, k) => {
      const bkey = `${key}#${k}`
      wantB.add(bkey)
      let el = nodesB.get(bkey)
      if (!el) { el = document.createElement('div'); el.className = 'sbubble hide'; stInner.appendChild(el); nodesB.set(bkey, el) }
      const rr = room.arr.find((x) => x.c.id === v.id), pos = wantR.get(v.id)
      const bx = room.x + 5 + k * lane
      const line = robotLine(rr.c, rr.s)
      const html = `<div class="say"><b>${robotTag(rr.c)}</b> ${esc(line.say)}</div>${line.act ? `<div class="act">${esc(line.act)}</div>` : ''}`
      if (el._h !== html) { el.innerHTML = html; el._h = html }
      el.className = `sbubble ${line.cls}`
      el.style.width = `${bw}px`
      el.style.transform = `translate(${bx}px, ${room.y + G.labelH - 2}px)`
      el.style.setProperty('--tail', `${Math.max(8, Math.min(bw - 20, pos.x + 26 - bx))}px`)
    })
  }
  for (const [key, el] of nodesB) if (!wantB.has(key)) { el.remove(); nodesB.delete(key) }

  spawned.clear()
  if (hoverId) showHover(hoverId, T)
  for (const w of wins.values()) paintWin(w, T)
}

// hover: a robot shows its full line; a nexus ties itself to its crew
function showHover(id, T) {
  const x = byId.get(id)
  tether.innerHTML = ''
  for (const el of nodesR.values()) el.classList.remove('dim')
  for (const el of nodesN.values()) el.classList.remove('hl')
  hoverB.classList.add('hide')
  if (!x) return
  if (x.kind === 'child') {
    const el = nodesR.get(id), s = childAt(x, T)
    if (!el || !s || s.st === 'need') return
    const line = robotLine(x, s)
    hoverB.innerHTML = `<div class="say"><b>${robotTag(x)}</b> ${esc(line.say)}</div>${line.act ? `<div class="act">${esc(line.act)}</div>` : ''}
      <div class="more">${esc(x.title)}<br>${esc(x.model || 'model ?')}${ctxAt(x, T) ? ' · context ' + fmtK(ctxAt(x, T)) : ''}${x.contract ? `<br>contract <b>${esc(x.contract.feature)}</b> · piece <b>${esc(x.contract.piece)}</b>${x.contract.consumes.length ? ' · writes against ' + x.contract.consumes.map(esc).join(', ') + ' (does not wait)' : ''}` : ''}${x.twin ? '<br>A/B twin — independent by design' : ''}${s.say && s.st !== 'done' ? '<br>💬 ' + esc(firstSentence(s.say.t, 240)) : ''}<br><i>click: open · shift+click: select</i></div>`
    hoverB.className = `sbubble ${line.cls}`
    hoverB.style.transform = `translate(${Math.max(8, (el._x ?? 0) - 100)}px, ${(el._y ?? 0) - 8}px) translateY(-100%)`
    hoverB.style.setProperty('--tail', '120px')
    const nx = nodesN.get(x.station), m = nx && /translate\(([-\d.]+)px, ([-\d.]+)px\)/.exec(nx.style.transform)
    if (m) {
      tether.setAttribute('width', stInner.offsetWidth); tether.setAttribute('height', stInner.offsetHeight)
      tether.innerHTML = `<line x1="${+m[1] + 48}" y1="${+m[2] + 60}" x2="${(el._x ?? 0) + 32}" y2="${(el._y ?? 0) + 32}"/>`
      nx.classList.add('hl')
    }
    // contract pieces it writes against (and that write against it), and its twin
    const ax = (el._x ?? 0) + 32, ay = (el._y ?? 0) + 32
    for (const [rid, rel] of nodesR) {
      if (rid === id) continue
      const o = byId.get(rid)
      let label = null
      if (x.contract && o.contract && o.contract.feature === x.contract.feature) {
        if (x.contract.consumes.includes(o.contract.piece)) label = `consumes ${o.contract.piece}`
        else if (o.contract.consumes.includes(x.contract.piece)) label = `${o.contract.piece} consumes`
      }
      if (!label && x.twin && o.twin && o.station === x.station && o.issue === x.issue) label = 'twin'
      if (!label) continue
      const bx = (rel._x ?? 0) + 32, by = (rel._y ?? 0) + 32
      tether.innerHTML += `<line class="dep" x1="${ax}" y1="${ay}" x2="${bx}" y2="${by}"/><text x="${(ax + bx) / 2}" y="${(ay + by) / 2 - 4}" text-anchor="middle">${esc(label)}</text>`
    }
    if (!m && tether.innerHTML) { tether.setAttribute('width', stInner.offsetWidth); tether.setAttribute('height', stInner.offsetHeight) }
  } else {
    const nx = nodesN.get(id)
    if (!nx) return
    const m = /translate\(([-\d.]+)px, ([-\d.]+)px\)/.exec(nx.style.transform) || [0, 0, 0]
    const cx = +m[1] + 48, cy = +m[2] + 48
    tether.setAttribute('width', stInner.offsetWidth); tether.setAttribute('height', stInner.offsetHeight)
    let lines = ''
    for (const [rid, el] of nodesR) {
      const c = byId.get(rid)
      if (c.station === id) lines += `<line x1="${cx}" y1="${cy}" x2="${(el._x ?? 0) + 32}" y2="${(el._y ?? 0) + 32}"/>`
      else el.classList.add('dim')
    }
    tether.innerHTML = lines
  }
}
stInner.addEventListener('mouseover', (ev) => {
  const hit = ev.target.closest('.srobot, .snexus')
  const id = hit ? hit.dataset.id : null
  if (id !== hoverId) { hoverId = id; showHover(id, T) }
})
stInner.addEventListener('mouseleave', () => { hoverId = null; showHover(null, T) })
station.addEventListener('click', onSceneClick)
station.addEventListener('submit', onSceneSubmit)

/* ---------- which layout ---------- */
let LAYOUT = 'attn'
function setCounts(counts) {
  $('#c-working').textContent = `⚙ ${counts.working || 0} working`
  $('#c-need').textContent = `! ${counts.need || 0} need${counts.need === 1 ? 's' : ''} you`
  $('#c-need').classList.toggle('zero', !counts.need)
  $('#c-done').textContent = `✓ ${counts.done || 0} ready`
}
function render(T) { if (LAYOUT === 'grid') renderGrid(T); else renderStation(T); paintTele(T); paintLog(T); if (sel.size) paintSel() }
function setLayout(l) {
  LAYOUT = l
  for (const k of ['station', 'attn', 'grid']) $('#lay-' + k).classList.toggle('on', l === k)
  world.style.display = l === 'grid' ? '' : 'none'; station.style.display = l !== 'grid' ? 'block' : 'none'
  world.innerHTML = ''; lastSig = ''
  for (const m of [nodesR, nodesN, nodesB, nodesS]) { for (const el of m.values()) el.remove(); m.clear() }
  speech.clear()
  bgSig = ''; stBg.innerHTML = ''
  render(T)
}
$('#lay-station').onclick = () => setLayout('station')
$('#lay-grid').onclick = () => setLayout('grid')
$('#lay-attn').onclick = () => setLayout('attn')
addEventListener('resize', () => { bgSig = ''; render(T) })
setInterval(() => {
  const idle = [...nodesR.values()].filter((el) => !el.classList.contains('walk') && (el.classList.contains('idle') || el.classList.contains('done') || el.classList.contains('working')))
  if (idle.length) idle[Math.floor(Math.random() * idle.length)].classList.toggle('flip')
}, 1800)

station.style.display = 'block'



/* ---------- selection (shift+click) and batch actions ---------- */
const sel = new Set()
function toggleSel(id) { if (sel.has(id)) sel.delete(id); else sel.add(id); paintSel(); render(T) }
function clearSel() { if (!sel.size) return false; sel.clear(); paintSel(); render(T); return true }
const greenOpen = (ids) => ids.filter((id) => { const c = byId.get(id), s = c && childAt(c, T); return s && s.st === 'done' && s.ci === 'green' })  // visible at T means not merged yet at T
const runningOf = (ids) => ids.filter((id) => { const c = byId.get(id), s = c && childAt(c, T); return s && (s.st === 'working' || s.st === 'idle' || s.st === 'need') })
function mergeIds(ids) { for (const id of ids) { const c = byId.get(id); c.simMergeAt = T; logEvent({ at: T, id, ic: '✈', t: `you merged PR #${c.pr ? c.pr.id : '?'} — lifted off`, cls: 'you' }) } render(T) }
function stopIds(ids) { for (const id of ids) { byId.get(id).simStopAt = T; sim.needs = sim.needs.filter((n) => n.id !== id); logEvent({ at: T, id, ic: '■', t: 'you stopped it', cls: 'you' }) } render(T) }
function paintSel() {
  const bar = $('#selbar')
  for (const id of [...sel]) if (!childAt(byId.get(id), T)) sel.delete(id)
  bar.hidden = !sel.size
  if (!sel.size) return
  const ids = [...sel], g = greenOpen(ids), r = runningOf(ids)
  bar.innerHTML = `<b>${ids.length} selected</b>
    <button class="go" data-b="merge" ${g.length ? '' : 'disabled'}>✈ merge ${g.length} green</button>
    <button class="stop" data-b="stop" ${r.length ? '' : 'disabled'}>■ stop ${r.length}</button>
    <button data-b="open">⤢ open ${ids.length}</button>
    <button data-b="clear">clear</button><small>shift+click adds · Esc clears</small>`
}
$('#selbar').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-b]'); if (!b) return
  const ids = [...sel]
  if (b.dataset.b === 'merge') { mergeIds(greenOpen(ids)); clearSel() }
  if (b.dataset.b === 'stop') { stopIds(runningOf(ids)); clearSel() }
  if (b.dataset.b === 'open') { ids.forEach((id) => openWin(id)); clearSel() }
  if (b.dataset.b === 'clear') clearSel()
})

/* ---------- telemetry: API calls and tokens per minute across the fleet, from each transcript's usage ---------- */
const USAGE = [...F.parents, ...F.children].filter((x) => x.usage && x.usage.length).map((x) => {
  const at = x.usage.map((u) => u[0]), cOut = [], cIn = [], cRead = []
  let o = 0, n = 0, r = 0
  for (const u of x.usage) { o += u[1]; n += u[2] + u[3] + u[4]; r += u[3]; cOut.push(o); cIn.push(n); cRead.push(r) }
  x.uat = at
  return { x, at, cOut, cIn, cRead }
})
const fmtK = (n) => n >= 1e6 ? (n / 1e6).toFixed(1).replace('.', ',') + 'M' : n >= 1e3 ? Math.round(n / 1e3) + 'k' : String(Math.round(n))
function ctxAt(x, T) { if (!x.usage || !x.uat) return null; const i = upto(x.uat, T); if (i < 0) return null; const u = x.usage[i]; return u[2] + u[3] + u[4] }
function paintTele(T) {
  const W = 300
  let calls = 0, out = 0, inp = 0, read = 0
  for (const u of USAGE) {
    const a = upto(u.at, T - W), b = upto(u.at, T)
    if (b < 0) continue
    calls += b - a; out += u.cOut[b] - (a >= 0 ? u.cOut[a] : 0); inp += u.cIn[b] - (a >= 0 ? u.cIn[a] : 0); read += u.cRead[b] - (a >= 0 ? u.cRead[a] : 0)
  }
  const m = W / 60
  $('#c-tele').textContent = `⚡ ${Math.round(calls / m)} calls/min · ${fmtK(out / m)} out tok/min`
  $('#c-tele').title = `the whole fleet, last 5 min\ninput: ${fmtK(inp / m)} tok/min, ${inp ? Math.round(100 * read / inp) : 0}% read from cache\noutput: ${fmtK(out / m)} tok/min\nno US$ cost: the subscription is not billed per token, and this model's per-token price is not in the data`
}


/* ---------- ship's log: only the milestones, newest first ---------- */
const EVENTS = []
function logEvent(e) { const i = upto(EVENTS.map((x) => x.at), e.at); EVENTS.splice(i + 1, 0, e) }
for (const c of F.children) {
  const cap = byId.get(c.station)
  EVENTS.push({ at: c.first, id: c.id, ic: '⇣', t: `dispatched by ${cap ? (emblemOf.get(cap.id) || '') + ' ' + cap.name : '?'}` })
  const prTool = c.log.find((e) => e.k === 'tool' && /gh pr create/.test(e.t || ''))
  if (c.pr) EVENTS.push({ at: prTool ? prTool.at : c.last, id: c.id, ic: '⇪', t: `opened PR #${c.pr.id}` })
  const ch = (c.pr && c.pr.checks) || []
  if (ch.length && ch.every((k) => k[1])) {
    const red = ch.some((k) => /FAIL|ERROR|CANCEL|TIMED/i.test(k[2] || ''))
    EVENTS.push({ at: Math.max(...ch.map((k) => k[1])), id: c.id, ic: red ? '✗' : '✓', t: red ? 'CI red' : 'CI green', cls: red ? 'bad' : 'ok' })
  }
  if (c.pr && c.pr.mergedAt) EVENTS.push({ at: c.pr.mergedAt, id: c.id, ic: '✈', t: `PR #${c.pr.id} merged — lifted off`, cls: 'ok' })
  else if (!c.pr && !c.live) EVENTS.push({ at: c.last, id: c.id, ic: '■', t: 'finished without a PR' })
  for (let k = 1; k < c.log.length; k++) {
    const a = c.log[k - 1], b = c.log[k]
    if (b.at - a.at > STUCK && a.k !== 'tool') EVENTS.push({ at: a.at + STUCK, id: c.id, ic: '⏸', t: `stranded — idle for ${ago(b.at - a.at)}`, cls: 'warn' })
  }
}
EVENTS.sort((a, b) => a.at - b.at)
let logKey = ''
function paintLog(T) {
  const n = upto(EVENTS.map((e) => e.at), T)
  const key = n + ':' + EVENTS.length
  const last = EVENTS[n], lc = $('#log .lc')
  if ($('#log').classList.contains('min') && last) {
    const c = byId.get(last.id)
    const html = `<span class="tick ${last.cls || ''}">${hhmm(last.at)} <i>${last.ic}</i> <b>${c ? robotTag(c) : ''}</b> ${esc(last.t)}</span>`
    if (lc._h !== html) { lc.innerHTML = html; lc._h = html; lc.firstChild.classList.add('new') }
  } else { lc._h = ''; lc.textContent = `${n + 1} milestones up to ${hhmm(T)}` }
  if (key === logKey) return
  const fresh = Math.max(0, n - (+(logKey.split(':')[0]) || n))
  logKey = key
  const rows = EVENTS.slice(Math.max(0, n - 39), n + 1).reverse()
  $('#log .lb').innerHTML = rows.map((e, k) => {
    const c = byId.get(e.id)
    return `<div class="ev ${e.cls || ''} ${k < fresh && fresh < 6 ? 'new' : ''}" data-ev="${e.id}"><time>${hhmm(e.at)}</time><i>${e.ic}</i><span><b>${c ? robotTag(c) : ''}</b> ${esc(e.t)}</span></div>`
  }).join('')
}
$('#log').addEventListener('click', (ev) => {
  if (ev.target.closest('[data-logtoggle]')) { const m = $('#log').classList.toggle('min'); $('#log .lh button').textContent = m ? '▸' : '▾'; logKey = ''; paintLog(T); return }
  const r = ev.target.closest('[data-ev]'); if (r && byId.get(r.dataset.ev)) openWin(r.dataset.ev)
})

/* ---------- bridge commands (simulated) ---------- */
let simN = 0, pendingCmd = null
function simChild(p, num, note) {
  const id = `sim-${num}-${++simN}`, t0 = T
  const steps = [
    [0, 'Bash', `gh issue view ${num} --comments`, `reading issue #${num}`],
    [70, 'Grep', 'def handle_', 'looking for where to change'],
    [140, 'Read', 'core.py', 'reading core.py and the tests beside it'],
    [220, 'Edit', 'core.py', 'writing the fix'],
    [300, 'Edit', 'test_core.py', 'writing the test that proves it'],
    [380, 'Bash', 'PYTHONPATH=src python3 -m pytest -q', 'running the full suite'],
    [470, 'Bash', 'pytest -q tests/test_core.py', 'suite green; checking again'],
    [540, 'Bash', `git push -u origin fix/issue-${num}`, 'pushing the branch'],
    [600, 'Bash', `gh pr create --title "fix #${num}"`, 'opening the PR'],
    [660, 'Bash', 'gh pr checks --watch', 'waiting for CI'],
  ]
  const log = [{ k: 'user', t: `Work on issue #${num} in this repo${note ? ': ' + note : ''}`, at: t0 }]
  for (const [dt, n, x] of steps) log.push({ k: 'tool', n, t: x, at: t0 + dt }, { k: 'res', t: 'ok', at: t0 + dt + 5 })
  log.push({ k: 'say', t: `Closing report: issue #${num} fixed, PR open, CI green (simulated).`, at: t0 + 760 })
  const c = { id, short: id.slice(0, 8), parent: p.id, station: p.id, repo: p.repo, issue: `#${num}`, title: note || `issue #${num} (dispatched from the bridge, simulated)`,
    name: '', state: 'done', live: false, status: null, detail: '', needs: null, pr: { id: String(9000 + simN), kind: 'pr', state: 'OPEN', checks: [[t0 + 665, t0 + 740, 'SUCCESS'], [t0 + 665, t0 + 755, 'SUCCESS']] }, model: 'opus (simulated)', klass: 'mech',
    tokens: 0, first: t0, last: t0 + 765, kind: 'child', sim: true, log, timeline: steps.map(([dt, , , d]) => ({ at: t0 + dt + 2, t: d, s: 'working' })) }
  c.ats = c.log.map((e) => e.at); c.tats = c.timeline.map((e) => e.at)
  F.children.push(c); byId.set(id, c)
  logEvent({ at: t0, id, ic: '⇣', t: `you dispatched from the bridge → ${p.name}`, cls: 'you' })
  if (c.last + LINGER + 120 > F.now) { F.now = c.last + LINGER + 120; scrub.max = Math.ceil(F.now) }
  return c
}
function bridgeCommand(raw) {
  const out = $('#bridge-cmd .out')
  const say = (t, err) => { out.textContent = t; out.classList.toggle('err', !!err); clearTimeout(out._t); out._t = setTimeout(() => (out.textContent = ''), 8000) }
  const m = raw.trim().match(/^\/(\w+)\s*(.*)$/)
  if (!m) return say('start with / — e.g. /dispatch mnemo #123 · /msg #682 text · /msg all text. To talk to one session, click it.', true)
  const [, verb, rest] = m
  const { list } = view(T)
  if (verb === 'dispatch') {
    const mm = rest.match(/^(\S+)\s+#?(\d+)\s*(.*)$/)
    if (!mm) return say('usage: /dispatch <repo> #<issue> [note]', true)
    const [, repo, num, note] = mm
    const t = list.find((x) => x.repo === repo)
    const stn = t && [...t.stations, ...t.quiet].find((st) => st.p.live && !st.p.orphan)
    if (!stn) return say(`no live captain in ${repo} at this point of the replay — repos: ${list.map((x) => x.repo).join(', ')}`, true)
    const c = simChild(stn.p, num, note)
    spawned.add(c.id); setPlaying(true)
    say(`→ #${num} dispatched in ${repo} under ${emblemOf.get(stn.p.id) || ''} ${stn.p.name} (simulated · in the app: mnemo dispatch ${num})`)
    render(T); return
  }
  if (verb === 'yes') {
    if (!pendingCmd || performance.now() > pendingCmd.exp) return say('nothing to confirm', true)
    const p = pendingCmd; pendingCmd = null; p.run(); return say(p.done)
  }
  const crewIds = () => list.flatMap((t) => t.stations.flatMap((st) => st.crew.map((r) => r.c.id)))
  if (verb === 'merge') {
    if (rest.trim() !== 'green') return say('usage: /merge green — merges every PR in the hangar whose CI is green', true)
    const ids = greenOpen(crewIds())
    if (!ids.length) return say('no green PR waiting for merge right now', true)
    pendingCmd = { exp: performance.now() + 20000, run: () => mergeIds(ids), done: `✈ ${ids.length} PR${ids.length > 1 ? 's' : ''} merged (simulated · in the app: gh pr merge on each, and pr-follow ends the child)` }
    return say(`merge ${ids.length} green PR${ids.length > 1 ? 's' : ''}: ${ids.map((id) => byId.get(id).issue).join(' ')} — type /yes within 20 s to confirm`)
  }
  if (verb === 'stop') {
    if (rest.trim() !== 'all') return say('usage: /stop all — stops every working child (the conversation stays; it can resume)', true)
    const ids = runningOf(crewIds())
    if (!ids.length) return say('nobody is working right now', true)
    pendingCmd = { exp: performance.now() + 20000, run: () => stopIds(ids), done: `■ ${ids.length} child${ids.length > 1 ? 'ren' : ''} stopped (simulated · in the app: claude stop on each)` }
    return say(`stop ${ids.length} working child${ids.length > 1 ? 'ren' : ''} — type /yes within 20 s to confirm`)
  }
  if (verb === 'msg') {
    const mm = rest.match(/^(\S+)\s+(.+)$/)
    if (!mm) return say('usage: /msg <#issue | captain | all> <text>', true)
    const [, who, text] = mm
    const crew = list.flatMap((t) => t.stations.flatMap((st) => st.crew))
    const targets = who === 'all'
      ? crew.filter((r) => r.s.st === 'working' || r.s.st === 'idle').map((r) => r.c)
      : [...crew.map((r) => r.c).filter((c) => c.issue + (c.twin ? '·' + c.twin : '') === who || c.issue === who || c.short === who), ...F.parents.filter((p) => p.name === who)]
    if (!targets.length) return say(`nobody called ${who} in the fleet right now`, true)
    const from = $('#bridge-cmd input').getBoundingClientRect()
    targets.forEach((x, k) => { setTimeout(() => fly(from, rectOf(x.id), '✉'), k * 140); if (x.kind === 'child') sim.sent.set(x.id, { text, at: performance.now() }) })
    say(`→ sent to ${who === 'all' ? targets.length + ' children' : who} (simulated · in the app: through the Claude Code socket)`)
    render(T); setTimeout(() => render(T), 5100); return
  }
  say(`unknown /${verb} — use /dispatch, /msg, /merge green or /stop all`, true)
}

/* ---------- clock ---------- */
const scrub = $('#scrub'), clock = $('#clock')
scrub.min = Math.floor(F.start); scrub.max = Math.ceil(F.now)
// start where the most is going on: busy robots, spread over the most rooms
const busiest = (() => {
  let best = [0, F.now]
  for (let t = F.start; t <= F.now; t += 120) {
    const live = F.children.map((c) => childAt(c, t)).filter(Boolean)
    const rooms = new Set(live.map(roomOf))
    const score = live.filter((s) => s.st === 'working').length + 4 * rooms.size
    if (score > best[0]) best = [score, t]
  }
  return best[1]
})()
let T = busiest, playing = false, lastFrame = 0
const fmt = (t) => new Date(t * 1000).toLocaleString('en-GB', { weekday: 'short', day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' })
function setT(t, animate = false) {
  const prev = T
  T = Math.max(F.start, Math.min(F.now, t))
  if (animate) events(prev, T)
  scrub.value = T
  const live = F.now - T < 60
  clock.textContent = live ? 'now' : fmt(T)
  $('#live').classList.toggle('on', live)
  render(T)
}
function setPlaying(on) { playing = on; $('#play').textContent = on ? '❚❚' : '▶'; $('#play').classList.toggle('on', on); lastFrame = 0 }
$('#play').onclick = () => setPlaying(!playing)
scrub.oninput = () => setT(+scrub.value)
$('#live').onclick = () => { setPlaying(false); setT(F.now) }
let acc = 0
function frame(ts) {
  if (playing) {
    if (lastFrame) {
      acc += (ts - lastFrame) / 1000 * +$('#speed').value
      if (acc >= 15) { setT(T + acc, true); acc = 0; if (T >= F.now) setPlaying(false) }
    }
    lastFrame = ts
  }
  requestAnimationFrame(frame)
}
addEventListener('keydown', (ev) => {
  const typing = ev.target.tagName === 'INPUT'
  const dn = /^Digit([1-9])$/.exec(ev.code)
  if (dn && (ev.altKey || ev.metaKey) && LAYOUT === 'attn' && bridgeExc[+dn[1] - 1]) { ev.preventDefault(); openWin(bridgeExc[+dn[1] - 1].id); return }
  if ((ev.metaKey || ev.ctrlKey) && ev.key === '\\') { ev.preventDefault(); if (wins.size) setCollapsed(!collapsed); return }
  if (ev.key === 'Escape' && pop.classList.contains('open')) { closePop(); return }
  if (triOpen) {
    if (ev.key === 'Escape') { closeTriage(); return }
    if (typing) return
    const n = sim.needs[triIdx]
    if (ev.key === 'ArrowRight') { triIdx++; paintTriage(); return }
    if (ev.key === 'ArrowLeft') { triIdx--; paintTriage(); return }
    if (ev.key.toLowerCase() === 't' && n) { closeTriage(); openWin(n.id); return }
    const o = ($('#triage .tri-card')._opts || []).find(([k]) => k === ev.key.toLowerCase())
    if (o) triAnswer(o[2])
    return
  }
  if (ev.key === 'Escape') { if (typing) ev.target.blur(); if (clearSel()) return; if (wins.size && !collapsed) setCollapsed(true); return }
  if (typing) return
  if (ev.key === 'Tab' && sim.needs.length) { ev.preventDefault(); openTriage(); return }
  if (ev.key === '/' && LAYOUT === 'station') { ev.preventDefault(); station.scrollTo({ top: 0, behavior: 'smooth' }); $('#bridge-cmd input').focus(); return }
  if (ev.key === ' ') { ev.preventDefault(); setPlaying(!playing) }
})
setT(T)
setPlaying(true)
requestAnimationFrame(frame)

// test hook: #shot=sim|win pauses at the busiest moment and stages a state for a screenshot
if (location.hash.startsWith('#shot')) {
  document.body.classList.add('notrans')
  setPlaying(false)
  const mode = (location.hash.match(/shot=(\w+)/) || [])[1], lay = (location.hash.match(/lay=(\w+)/) || [])[1]
  if (lay) setLayout(lay)
  if (mode === 'sim' || mode === 'win' || mode === 'tri') $('#sim').click()
  if (mode === 'tri') { $('#sim').click(); openTriage() }
  if (mode === 'hangar') {
    let best = [0, T]
    for (let t = F.start; t <= F.now; t += 300) { const n = F.children.filter((c) => childAt(c, t)?.st === 'done').length; if (n > best[0]) best = [n, t] }
    setT(best[1])
  }
  if (mode === 'merge') {
    let best = [0, T]
    for (let t = F.start; t <= F.now; t += 300) { const n = F.children.filter((c) => childAt(c, t)?.st === 'done').length; if (n > best[0]) best = [n, t] }
    setT(best[1]); bridgeCommand('/merge green'); const ask = $('#bridge-cmd .out').textContent; bridgeCommand('/yes')
    document.title = ask + ' || ' + $('#bridge-cmd .out').textContent + ' || done now: ' + F.children.filter((c) => childAt(c, T)?.st === 'done').length
    console.error('MERGE-TEST', document.title)
  }
  if (mode === 'col') { const c = F.children.find((x) => childAt(x, T)); openWin(c.id); setCollapsed(true) }
  if (mode === 'diff') {
    const c = F.children.find((x) => childAt(x, T) && x.log.some((e) => e.d && e.at <= T))
    if (c) { openWin(c.id); setTimeout(() => { const sp = document.querySelector('.dfiles [data-file]'); if (sp) sp.click() }, 50) }
  }
  if (mode === 'win') { const r = document.querySelector('.crew [data-id], .srobot:not(.need)'); const n = document.querySelector('.nexus, .snexus'); if (n) openWin(n.dataset.id); if (r) openWin(r.dataset.id) }
  window.onerror = (m) => document.title = 'ERR ' + m
}
