<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nexus v2 · prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Silkscreen&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0a0f1e; --grid: #141c33; --card: #10172b; --card-edge: #26335c; --ink: #dfe6ff; --dim: #7f8bb3; --faint: #4a5680;
  --working: #38bdf8; --need: #fb7185; --done: #4ade80; --idle: #64748b;
  --paper: #f4efe2; --paper-ink: #16130d; --term: #0d0d10; --term-ink: #d6d6d6;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font: 12px/1.4 'JetBrains Mono', ui-monospace, monospace; overflow: hidden;
  background-image: radial-gradient(var(--grid) 1px, transparent 1px); background-size: 16px 16px; }
img { image-rendering: pixelated; }
button { font: inherit; color: inherit; cursor: pointer; }

/* top bar */
.top { position: fixed; inset: 0 0 auto 0; height: 52px; display: flex; align-items: center; gap: 16px; padding: 0 16px;
  background: #0c1326ee; border-bottom: 2px solid var(--card-edge); z-index: 20; backdrop-filter: blur(4px); }
.brand { font-family: Silkscreen, monospace; font-size: 20px; letter-spacing: 2px; color: #a5b4fc; text-shadow: 2px 2px 0 #1e1b4b; }
.chips { display: flex; gap: 8px; }
.chip { padding: 3px 7px; border: 2px solid; border-radius: 2px; font-weight: 700; background: #0008; white-space: nowrap; font-size: 11px; }
.replay button, #clock { white-space: nowrap; }
.top { gap: 12px; }
.chip.working { color: var(--working); } .chip.need { color: var(--need); cursor: pointer; } .chip.done { color: var(--done); }
.chip.need.zero { opacity: .35; cursor: default; }
.replay { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.replay button, .replay select { background: #18213f; border: 2px solid var(--card-edge); color: var(--ink); padding: 3px 8px; border-radius: 2px; font: inherit; }
.replay button.on { border-color: var(--working); color: var(--working); }
#scrub { width: 200px; accent-color: #a5b4fc; }
#clock { min-width: 120px; font-weight: 700; color: #c7d2fe; }
#sim { border-color: #7f1d1d !important; color: var(--need) !important; }

/* world */
#world { position: absolute; inset: 52px 0 0 0; overflow: auto; padding: 16px 16px 80px; display: grid;
  grid-template-columns: repeat(auto-fill, minmax(620px, 1fr)); gap: 16px; align-content: start; align-items: start; }
.terr { background: var(--card); border: 2px solid var(--card-edge); border-radius: 4px; box-shadow: 4px 4px 0 #050811; min-width: 0; }
.terr.quiet-only { opacity: .75; }
.terr > h2 { margin: 0; padding: 8px 12px; font: 14px Silkscreen, monospace; letter-spacing: 1px; border-bottom: 2px solid var(--card-edge);
  display: flex; gap: 12px; align-items: baseline; background: #0d1426; }
.terr > h2 small { font: 11px 'JetBrains Mono', monospace; color: var(--dim); letter-spacing: 0; }
.station { display: grid; grid-template-columns: 150px 1fr; gap: 8px; padding: 12px; border-bottom: 1px dashed var(--card-edge); }
.station:last-of-type { border-bottom: 0; }
.nexus { position: relative; display: flex; flex-direction: column; align-items: center; cursor: pointer; padding-top: 4px; }
.nexus .sprite { width: 96px; height: 96px; position: relative; z-index: 1; }
.nexus .ring { position: absolute; top: 4px; width: 96px; height: 96px; border-radius: 50%; }
.nexus.busy .ring { box-shadow: 0 0 22px 4px #38bdf855; animation: pulse 2.4s ease-in-out infinite; }
.nexus.has-need .ring { box-shadow: 0 0 26px 6px #fb718566; animation: pulse 1s ease-in-out infinite; }
.nexus.dead .sprite, .nexus.ghost .sprite { opacity: .35; filter: grayscale(1); }
.nexus .name { margin-top: 2px; font-weight: 700; text-align: center; }
.nexus .topic { color: var(--dim); font-size: 11px; text-align: center; max-width: 146px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.nexus .mail { position: absolute; top: 0; right: 14px; z-index: 2; background: #1e3a8a; border: 2px solid #93c5fd; color: #dbeafe; padding: 0 4px; font-weight: 700; border-radius: 2px; }
.nexus:hover .sprite { transform: translateY(-2px); }
.crew { display: flex; flex-wrap: wrap; gap: 4px 6px; align-content: flex-start; min-height: 120px; }
.crew .empty { color: var(--faint); align-self: center; padding-left: 8px; }

/* robots */
.robot { position: relative; width: 176px; height: 168px; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; cursor: pointer; }
.robot .body { width: 64px; height: 64px; position: relative; z-index: 1; }
.robot .acc { position: absolute; bottom: 18px; width: 64px; height: 64px; opacity: .9; }
.robot .halo { position: absolute; bottom: 18px; width: 72px; height: 22px; border-radius: 50%; }
.robot.working .halo { background: radial-gradient(#38bdf899, transparent 70%); animation: pulse 1.6s infinite; }
.robot.need .halo { background: radial-gradient(#fb7185cc, transparent 70%); animation: pulse .8s infinite; }
.robot.done .halo { background: radial-gradient(#4ade8077, transparent 70%); }
.robot.done .body { filter: saturate(.6); }
.robot.working .body { animation: bob .9s steps(2) infinite; }
.robot .tag { font-weight: 700; height: 18px; white-space: nowrap; }
.robot .tag .via { color: var(--dim); font-weight: 400; }
.robot.need { height: 262px; }
.robot.need, .robot:hover { z-index: 6; }
.nexus:hover { z-index: 6; }
.robot.flash { animation: flash .5s 3; }

/* speech bubbles */
.bubble { position: absolute; bottom: 92px; left: 50%; transform: translateX(-50%); width: 170px; background: var(--paper); color: var(--paper-ink);
  border: 2px solid #111; box-shadow: 2px 2px 0 #000; padding: 4px 6px; font-size: 11px; line-height: 1.3; z-index: 3; border-radius: 2px; }
.bubble::after { content: ''; position: absolute; bottom: -8px; left: 50%; margin-left: -6px; border: 6px solid transparent; border-top-color: #111; border-bottom: 0; }
.bubble .say { overflow: hidden; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; }
.bubble .act { margin-top: 3px; color: #5b5444; font-size: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bubble .more { display: none; margin-top: 4px; padding-top: 4px; border-top: 1px dashed #b8ae95; font-size: 10px; color: #3c372a; }
.robot.idle .bubble { opacity: .7; }
.robot.done .bubble { background: #e9f8ec; }
.robot:hover .bubble, .nexus:hover .bubble { z-index: 9; width: 260px; }
.robot:hover .bubble .say { -webkit-line-clamp: 8; }
.robot:hover .bubble .more, .nexus:hover .bubble .more { display: block; }
.nexus .bubble { position: relative; bottom: auto; left: auto; transform: none; width: 146px; margin-top: 10px; }
.nexus .bubble::after { bottom: auto; top: -8px; border-top: 0; border-bottom: 6px solid #111; }
.nexus:hover .bubble { width: 146px; }
.bubble.need { background: #fff1f2; border-color: #be123c; box-shadow: 2px 2px 0 #4c0519; width: 236px; bottom: 92px; z-index: 8; }
.bubble.need::after { border-top-color: #be123c; }
.bubble.need .q { font-weight: 700; color: #881337; }
.bubble.need .opts { display: flex; flex-wrap: wrap; gap: 4px; margin: 5px 0; }
.bubble.need .opts button { background: #ffe4e6; border: 2px solid #be123c; color: #881337; padding: 1px 6px; border-radius: 2px; font-size: 11px; }
.bubble.need .opts button.go { background: #be123c; color: #fff; }
.bubble.need form { display: flex; gap: 4px; }
.bubble.need input { flex: 1; min-width: 0; font: inherit; font-size: 11px; border: 2px solid #be123c; padding: 2px 4px; background: #fff; color: #111; }
.bubble.need .link { margin-top: 4px; font-size: 10px; color: #9f1239; text-decoration: underline; cursor: pointer; }
.bubble.sent { background: #eef2ff; border-color: #4338ca; }

/* quiet sessions */
.quiet { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 12px 10px; border-top: 2px solid var(--card-edge); background: #0c1222; align-items: center; }
.quiet > span { color: var(--faint); margin-right: 4px; }
.qchip { display: flex; align-items: center; gap: 4px; padding: 2px 8px 2px 2px; border: 2px solid var(--card-edge); background: #131b33; border-radius: 2px; }
.qchip img { width: 28px; height: 28px; opacity: .8; }
.qchip:hover { border-color: #a5b4fc; }

/* flights */
#fx { position: fixed; inset: 0; pointer-events: none; z-index: 30; }
.env { position: fixed; font-size: 18px; filter: drop-shadow(2px 2px 0 #000); }
.env.reply { font-size: 16px; }

/* popups */
.win { position: fixed; background: var(--term); border: 2px solid #3b4a7a; box-shadow: 6px 6px 0 #00000099; border-radius: 4px; display: flex; flex-direction: column;
  resize: both; overflow: hidden; min-width: 360px; min-height: 220px; z-index: 40; }
.win.focus { border-color: #a5b4fc; }
.win .bar { display: flex; align-items: center; gap: 8px; padding: 4px 6px 4px 4px; background: #161d36; cursor: move; user-select: none; border-bottom: 2px solid #26335c; }
.win .bar img { width: 28px; height: 28px; }
.win .bar b { font-weight: 700; }
.win .bar .sub { color: var(--dim); overflow: hidden; white-space: nowrap; text-overflow: ellipsis; flex: 1; }
.win .bar .st { padding: 0 6px; border: 2px solid; border-radius: 2px; font-size: 11px; font-weight: 700; }
.win .bar button { background: none; border: 0; color: var(--dim); font-size: 16px; padding: 0 4px; }
.win .bar button:hover { color: #fff; }
.term { flex: 1; overflow: auto; padding: 8px 10px; color: var(--term-ink); font-size: 12px; white-space: pre-wrap; word-break: break-word; }
.term .l { margin: 0 0 6px; }
.term .user { background: #26262c; padding: 2px 6px; color: #e5e5e5; }
.term .user::before { content: '> '; color: #8a8a96; }
.term .say::before { content: '⏺ '; color: #e5e5e5; }
.term .tool::before { content: '⏺ '; color: #4ade80; }
.term .tool b { color: #fff; }
.term .res { color: #8b8b95; margin-top: -5px; padding-left: 2ch; }
.term .res::before { content: '⎿  '; }
.term .res.err { color: #f87171; }
.term .peer { color: #93c5fd; border-left: 3px solid #3b82f6; padding-left: 6px; }
.term .peer::before { content: '✉ '; }
.term .proto { color: #a78bfa; font-style: italic; }
.win .prompt { display: flex; gap: 6px; align-items: center; padding: 6px 10px; border-top: 1px solid #2a2a33; background: #111116; }
.win .prompt span { color: #8a8a96; }
.win .prompt input { flex: 1; background: transparent; border: 0; outline: 0; color: #fff; font: inherit; }
.win .foot { color: #5b6285; font-size: 10px; padding: 0 10px 4px; background: #111116; }

#note { position: fixed; left: 16px; bottom: 12px; z-index: 25; color: var(--dim); background: #0c1326ee; border: 2px solid var(--card-edge); padding: 4px 10px; border-radius: 2px; }


/* ---------- station layout ---------- */
.lay { display: flex; border: 2px solid var(--card-edge); border-radius: 2px; overflow: hidden; }
.lay button { background: #18213f; border: 0; padding: 3px 10px; font-weight: 700; color: var(--dim); }
.lay button.on { background: #312e81; color: #e0e7ff; }
#station { position: absolute; inset: 52px 0 0 0; overflow: auto; display: none;
  background: radial-gradient(1px 1px at 20% 30%, #fff8 50%, transparent 51%) 0 0 / 180px 140px,
              radial-gradient(1px 1px at 70% 80%, #fff6 50%, transparent 51%) 0 0 / 230px 190px,
              radial-gradient(1.5px 1.5px at 40% 60%, #a5b4fc88 50%, transparent 51%) 0 0 / 310px 260px, #070b17; }
#st-inner { position: relative; min-width: 1150px; }
.bridge { position: absolute; border: 3px solid #4338ca; background: linear-gradient(#1e1b4b, #0f1029); border-radius: 18px 18px 4px 4px; box-shadow: 0 0 0 3px #0b0d22, 0 0 30px #4338ca44 inset; transition: height .6s; }
.bridge.alert { border-color: #e11d48; box-shadow: 0 0 0 3px #0b0d22, 0 0 40px #e11d4855 inset; }
.bridge .blabel { position: absolute; left: 16px; top: 10px; font: 13px Silkscreen, monospace; letter-spacing: 1px; color: #c7d2fe; }
.bridge.alert .blabel { color: #fecdd3; }
.bridge .bstatus { position: absolute; right: 70px; top: 11px; color: var(--dim); font-size: 11px; }
.bridge .console { position: absolute; right: 18px; top: 12px; display: flex; gap: 6px; }
.bridge .console i { width: 10px; height: 10px; border-radius: 2px; background: #4338ca; animation: blink 1.8s infinite; }
.bridge .console i:nth-child(2) { animation-delay: .3s; background: #0ea5e9; } .bridge .console i:nth-child(3) { animation-delay: .9s; background: #22c55e; }
.bridge.alert .console i { background: #e11d48; animation-duration: .6s; }
.colhead { position: absolute; display: flex; font: 10px Silkscreen, monospace; letter-spacing: 1px; color: #7f8bb3; }
.colhead > div { padding-left: 8px; } .colhead small { font: 10px 'JetBrains Mono', monospace; color: #4a5680; letter-spacing: 0; margin-left: 6px; }
.deck { position: absolute; border: 3px solid #2b3a6b; background: #0e1529; border-radius: 4px; box-shadow: 0 0 0 3px #060912, 6px 6px 0 3px #03050b; transition: top .8s, height .8s; }
.deck .cmd, .deck .room { position: absolute; top: 0; bottom: 0; }
.deck .cmd { left: 0; background: linear-gradient(90deg, #151c38, #111831); border-right: 3px solid #2b3a6b; }
.deck .dlabel { position: absolute; left: 8px; top: 4px; font: 13px Silkscreen, monospace; letter-spacing: 1px; color: #c7d2fe; }
.deck .room { border-right: 2px solid #1f2a4d; }
.deck .room:last-child { border-right: 0; }
.deck .room::after { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 6px; background: #26335c; }
.deck .rcount { position: absolute; right: 6px; top: 3px; font: 10px Silkscreen, monospace; color: #4a5680; }
.room-lib { background: repeating-linear-gradient(90deg, transparent 0 22px, #2a20140d 22px 24px), linear-gradient(#1a1610 0 26px, #121a30 26px); }
.room-lib::before { content: ''; position: absolute; left: 6px; right: 6px; top: 6px; height: 16px; opacity: .35;
  background: repeating-linear-gradient(90deg, #b45309 0 5px, #78350f 5px 7px, #a16207 7px 11px, #1a1610 11px 13px); }
.room-shop { background: linear-gradient(#1b2340 1px, transparent 1px) 0 0 / 100% 16px, linear-gradient(90deg, #1b2340 1px, transparent 1px) 0 0 / 16px 100%, #10172d; }
.room-lab { background: radial-gradient(circle at 20% 70%, #10b98118 0 6px, transparent 7px) 0 0 / 46px 38px, linear-gradient(#0d2422, #0c1a26); }
.room-lab::before { content: ''; position: absolute; left: 8px; top: 8px; width: 60%; height: 12px; opacity: .45;
  background: repeating-linear-gradient(90deg, #34d399 0 4px, transparent 4px 14px); border-bottom: 2px solid #065f46; }
.room-hangar { background: linear-gradient(#141a26, #11161f); }
.room-hangar::after { background: repeating-linear-gradient(45deg, #ca8a04 0 8px, #1c1917 8px 16px) !important; height: 7px !important; }
.room-rest { background: radial-gradient(1px 1px at 30% 40%, #c7d2fe55 50%, transparent 51%) 0 0 / 40px 30px, linear-gradient(#0c1130, #0d1328); }
.srobot, .snexus, .sbubble { position: absolute; left: 0; top: 0; }
.srobot { width: 64px; height: 88px; transition: transform 1.4s ease-in-out, opacity 1.2s; cursor: pointer; z-index: 4; }
.srobot .body { width: 64px; height: 64px; position: relative; z-index: 1; }
.srobot .acc { position: absolute; left: 0; top: 4px; width: 64px; height: 64px; opacity: .9; }
.srobot .halo { position: absolute; left: -4px; top: 50px; width: 72px; height: 18px; border-radius: 50%; }
.srobot.working .halo { background: radial-gradient(#38bdf899, transparent 70%); animation: pulse 1.6s infinite; }
.srobot.need .halo { background: radial-gradient(#fb7185cc, transparent 70%); animation: pulse .8s infinite; }
.srobot.done .halo { background: radial-gradient(#4ade8077, transparent 70%); }
.srobot.flip .body { scale: -1 1; }
.srobot.walk .body { animation: walk .35s steps(2) infinite; }
.srobot.working:not(.walk) .body { animation: bob .9s steps(2) infinite; }
.srobot .tag { position: absolute; top: 66px; left: -20px; width: 104px; text-align: center; font-weight: 700; font-size: 11px; white-space: nowrap; text-shadow: 1px 1px 0 #000; }
.srobot .tag .em { color: #a5b4fc; }
.srobot .tag .pr { color: var(--done); }
.srobot.dim { opacity: .2; }
.srobot.leaving { opacity: 0; pointer-events: none; }
.srobot.flash .body { animation: flash .5s 4; }
.srobot .needslot .bubble { bottom: 96px; }
.srobot.need { z-index: 9; }
.snexus { width: 96px; transition: transform 1s ease-in-out, opacity .8s; cursor: pointer; z-index: 3; display: flex; flex-direction: column; align-items: center; }
.snexus .sprite { width: 96px; height: 96px; position: relative; z-index: 1; }
.snexus .ring { position: absolute; top: 0; width: 96px; height: 96px; border-radius: 50%; }
.snexus.busy .ring { box-shadow: 0 0 22px 4px #38bdf855; animation: pulse 2.4s ease-in-out infinite; }
.snexus.has-need .ring { box-shadow: 0 0 26px 6px #fb718566; animation: pulse 1s ease-in-out infinite; }
.snexus.dead .sprite, .snexus.ghost .sprite { opacity: .35; filter: grayscale(1); }
.snexus .name { font-weight: 700; font-size: 11px; white-space: nowrap; text-shadow: 1px 1px 0 #000; }
.snexus .name .em { color: #a5b4fc; font-size: 13px; }
.snexus .topic { color: var(--dim); font-size: 10px; text-align: center; width: 112px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.snexus .pact { margin-top: 3px; width: 112px; font-size: 10px; color: #bae6fd; background: #0c4a6e88; border: 1px solid #0369a1; padding: 1px 4px; border-radius: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.snexus .mail { position: absolute; top: 0; right: -6px; z-index: 2; background: #1e3a8a; border: 2px solid #93c5fd; color: #dbeafe; padding: 0 4px; font-weight: 700; border-radius: 2px; font-size: 11px; }
.snexus.small { width: 76px; } .snexus.small .sprite { width: 64px; height: 64px; } .snexus.small .topic, .snexus.small .pact { display: none; }
.snexus.small .name { font-size: 10px; }
.sbubble { width: 200px; background: var(--paper); color: var(--paper-ink); border: 2px solid #111; box-shadow: 2px 2px 0 #000; padding: 4px 6px; font-size: 11px; line-height: 1.3;
  border-radius: 2px; z-index: 6; transition: opacity .3s; }
.sbubble::after { content: ''; position: absolute; bottom: -8px; left: var(--tail, 30px); border: 6px solid transparent; border-top-color: #111; border-bottom: 0; }
.sbubble b { color: #3730a3; }
.sbubble .say { overflow: hidden; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; }
.sbubble .act { margin-top: 2px; color: #5b5444; font-size: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sbubble.done { background: #e9f8ec; } .sbubble.idle { background: #e5e7eb; }
.sbubble.hide { opacity: 0; pointer-events: none; }
#st-hover { position: absolute; z-index: 12; width: 280px; pointer-events: none; }
#st-hover .more { display: block; margin-top: 4px; padding-top: 4px; border-top: 1px dashed #b8ae95; font-size: 10px; color: #3c372a; }
#st-hover .say { -webkit-line-clamp: 8; }
#st-tether { position: absolute; left: 0; top: 0; pointer-events: none; z-index: 2; overflow: visible; }
#st-tether line { stroke: #a5b4fc; stroke-width: 2; stroke-dasharray: 4 4; animation: dash .6s linear infinite; }
.docks { position: absolute; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 10px 12px; border: 2px dashed #26335c; border-radius: 4px; background: #0b1122cc; }
.docks > b { font: 12px Silkscreen, monospace; color: #7f8bb3; letter-spacing: 1px; margin-right: 6px; }
.pod { display: flex; align-items: center; gap: 6px; padding: 4px 8px; border: 2px solid #26335c; background: #10172b; border-radius: 10px 10px 2px 2px; }
.pod > span { font: 11px Silkscreen, monospace; color: #c7d2fe; margin-right: 2px; }
.deck .quietrow { position: absolute; left: 6px; right: 6px; bottom: 10px; display: flex; flex-wrap: wrap; gap: 4px; }
.deck .quietrow .qchip { padding: 0 6px 0 0; font-size: 10px; } .deck .quietrow .qchip img { width: 22px; height: 22px; }
.notrans *, .notrans *::after { transition: none !important; }


/* captains: the glow sits on the floor under the chair, not around a crystal */
.snexus .ring, .nexus .ring { top: 74px !important; left: 50%; margin-left: -46px; width: 92px !important; height: 22px !important; border-radius: 50%; box-shadow: none !important; }
.snexus.busy .ring, .nexus.busy .ring { background: radial-gradient(#38bdf899, transparent 70%); animation: pulse 2.4s ease-in-out infinite; }
.snexus.has-need .ring, .nexus.has-need .ring { background: radial-gradient(#fb7185cc, transparent 70%); animation: pulse 1s ease-in-out infinite; }
.snexus.small .ring { top: 50px !important; margin-left: -30px; width: 60px !important; height: 14px !important; }
.snexus.dead .sprite, .nexus.dead .sprite { opacity: .55; filter: grayscale(.6); }
.snexus.ghost .sprite, .nexus.ghost .sprite { opacity: .5; filter: none; }
.snexus.busy .sprite { animation: type .5s steps(2) infinite; }
@keyframes type { 50% { transform: translateY(1px); } }
.srobot .ship { left: 4px !important; top: -30px !important; height: auto; z-index: 0; }
.srobot.launch .ship { transform: translate(90px, -380px); }
.tele { height: 96px; }


/* ---------- drawer (replaces the floating popups) ---------- */
#world, #station { right: var(--dwopen, 0px); transition: right .25s; }
#drawer { position: fixed; top: 52px; right: 0; bottom: 0; width: var(--dw, 640px); display: none; flex-direction: column; background: var(--term);
  border-left: 3px solid #3b4a7a; z-index: 40; box-shadow: -6px 0 0 #00000055; }
#drawer.open { display: flex; }
.dresize { position: absolute; left: -7px; top: 0; bottom: 0; width: 10px; cursor: ew-resize; z-index: 2; }
.dtabs { display: flex; background: #0b1124; border-bottom: 2px solid #26335c; overflow-x: auto; flex: none; }
.dtab { display: flex; align-items: center; gap: 6px; padding: 3px 6px 3px 3px; background: #121a33; border: 0; border-right: 1px solid #26335c; color: var(--dim); white-space: nowrap; font-weight: 700; }
.dtab img { width: 26px; height: 26px; } .dtab.on { background: #1d2750; color: #fff; box-shadow: inset 0 -3px 0 #a5b4fc; }
.dtab .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--idle); }
.dtab .x { color: var(--faint); padding: 0 3px; font-size: 14px; } .dtab .x:hover { color: #fff; }
.dpanes { flex: 1; min-height: 0; display: flex; }
.dpane { flex: 1; display: none; flex-direction: column; min-width: 0; } .dpane.on { display: flex; }
.dhead { display: flex; align-items: center; gap: 8px; padding: 6px 10px; background: #161d36; border-bottom: 2px solid #26335c; }
.crumbs { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--dim); }
.crumbs a { color: #c7d2fe; cursor: pointer; } .crumbs a:hover { text-decoration: underline; } .crumbs b { color: #fff; }
.crumbs .sep { color: var(--faint); margin: 0 5px; }
.dhead .st { padding: 0 6px; border: 2px solid; border-radius: 2px; font-size: 11px; font-weight: 700; white-space: nowrap; }
.dhead button { background: #18213f; border: 2px solid #26335c; color: var(--dim); padding: 0 6px; font-size: 11px; border-radius: 2px; white-space: nowrap; }
.dsub { padding: 4px 10px; color: var(--dim); font-size: 11px; border-bottom: 1px solid #1f2a4d; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dpane .prompt { display: flex; gap: 6px; align-items: center; padding: 6px 10px; border-top: 1px solid #2a2a33; background: #111116; }
.dpane .prompt span { color: #8a8a96; }
.dpane .prompt input { flex: 1; background: transparent; border: 0; outline: 0; color: #fff; font: inherit; }
.dfiles { display: flex; flex-wrap: wrap; gap: 5px; padding: 5px 10px; font-size: 11px; color: #c7d2fe; border-bottom: 1px solid #1f2a4d; }
.dfiles em { color: var(--faint); font-style: normal; } .dfiles span { background: #1b2340; border: 1px solid #2b3a6b; padding: 0 5px; border-radius: 2px; } .dfiles b { color: #86efac; font-weight: 400; }
.dpane .foot { color: #5b6285; font-size: 10px; padding: 0 10px 4px; background: #111116; }

/* ---------- triage ---------- */
#triage { position: fixed; inset: 0; z-index: 60; background: #050812cc; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(2px); }
#triage[hidden] { display: none; }
.tri-card { width: min(660px, 92vw); background: #12081a; border: 3px solid #e11d48; box-shadow: 0 0 0 3px #000, 8px 8px 0 #000, 0 0 60px #e11d4844; border-radius: 6px; padding: 14px 16px; }
.tri-head { display: flex; align-items: center; gap: 10px; font: 14px Silkscreen, monospace; color: #fecdd3; letter-spacing: 1px; }
.tri-head .n { color: #fff; } .tri-head button { margin-left: auto; background: none; border: 2px solid #4c0519; color: #fda4af; font: 11px 'JetBrains Mono', monospace; padding: 0 6px; }
.tri-who { display: flex; gap: 12px; align-items: center; margin: 12px 0 8px; } .tri-who img { width: 64px; height: 64px; }
.tri-who .crumbs { color: #fda4af; } .tri-who .crumbs b { color: #fff; } .tri-who .title { color: #e2e8f0; font-weight: 700; }
.tri-q { font-size: 14px; color: #fff; background: #2a0a17; border-left: 4px solid #e11d48; padding: 8px 10px; margin: 8px 0; }
.tri-ctx { font-size: 11px; color: #9ca3af; border: 1px dashed #3f1d2b; padding: 6px 8px; margin-bottom: 10px; }
.tri-ctx div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tri-opts { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
.tri-opts button { background: #2a0a17; border: 2px solid #e11d48; color: #fecdd3; padding: 4px 10px; border-radius: 2px; font-weight: 700; }
.tri-opts button.go { background: #e11d48; color: #fff; }
.tri-card kbd { background: #000; border: 1px solid #6b7280; border-radius: 2px; padding: 0 4px; font: 10px 'JetBrains Mono', monospace; margin-right: 5px; color: #e5e7eb; }
.tri-card form { display: flex; gap: 6px; } .tri-card input { flex: 1; background: #0b0b10; border: 2px solid #4c0519; color: #fff; font: inherit; padding: 4px 8px; outline: 0; }
.tri-keys { margin-top: 10px; color: #9f8a93; font-size: 11px; }
.tri-done { text-align: center; font: 16px Silkscreen, monospace; color: #86efac; padding: 30px 0; }

/* ---------- action micro-badges, captain highlight ---------- */
.srobot .ab { position: absolute; left: 48px; top: -4px; z-index: 3; min-width: 18px; height: 18px; padding: 0 3px; display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 700; background: #0b1020; color: #fff; border: 2px solid var(--idle); border-radius: 3px; box-shadow: 1px 1px 0 #000; }
.srobot.working .ab { border-color: var(--working); } .srobot.done .ab { border-color: var(--done); color: var(--done); }
.srobot.need .ab { border-color: var(--need); background: #4c0519; animation: pulse .8s infinite; }
.srobot.launch .ab { opacity: 0; }
.snexus.hl .sprite { filter: drop-shadow(0 0 6px #a5b4fc) drop-shadow(0 0 2px #fff); }

/* ---------- bridge prompt ---------- */
#bridge-cmd { position: absolute; left: 0; top: 0; z-index: 8; display: flex; flex-direction: column; gap: 3px; }
#bridge-cmd .row { display: flex; align-items: center; gap: 8px; background: #0b0d22; border: 2px solid #4338ca; border-radius: 3px; padding: 4px 8px; }
#bridge-cmd .row:focus-within { border-color: #a5b4fc; box-shadow: 0 0 12px #6366f155; }
#bridge-cmd .row span { color: #a5b4fc; font-weight: 700; }
#bridge-cmd input { flex: 1; background: transparent; border: 0; outline: 0; color: #fff; font: inherit; }
#bridge-cmd .hint { color: #6b74a8; font-size: 10.5px; } #bridge-cmd .hint code { color: #c7d2fe; }
#bridge-cmd .out { font-size: 11px; color: #86efac; min-height: 14px; } #bridge-cmd .out.err { color: #fda4af; }
.bridge .attend { position: absolute; right: 70px; top: 34px; background: #e11d48; color: #fff; border: 2px solid #fecdd3; font-weight: 700; padding: 2px 10px; border-radius: 2px; animation: pulse 1s infinite; }


/* ---------- cross-highlight: the session open in the drawer glows where it stands ---------- */
.srobot.focus .body, .snexus.focus .sprite, .robot.focus .body, .nexus.focus .sprite { filter: drop-shadow(0 0 3px #f0abfc) drop-shadow(0 0 10px #c026d3); }
.srobot.focus::before, .snexus.focus::before, .robot.focus::before, .nexus.focus::before { content: '▼'; position: absolute; top: -30px; left: 50%; margin-left: -7px; color: #f0abfc; font-size: 14px;
  text-shadow: 0 0 8px #e879f9; animation: hop .8s ease-in-out infinite; z-index: 7; }
.snexus.focus::before, .nexus.focus::before { top: -24px; }
.robot.focus::before { top: auto; bottom: 92px; }
.srobot.focus .tag, .robot.focus .tag { color: #f5d0fe; }
.srobot.focus { z-index: 8; }
@keyframes hop { 50% { transform: translateY(-5px); } }
#dhandle { position: fixed; right: 0; top: 38%; z-index: 41; writing-mode: vertical-rl; background: #1d2750; border: 2px solid #a5b4fc; border-right: 0; color: #e0e7ff;
  padding: 12px 5px; font-weight: 700; border-radius: 4px 0 0 4px; box-shadow: -4px 0 16px #6366f144; }
#dhandle[hidden] { display: none; }
#dhandle:hover { background: #312e81; }
/* ---------- quick diff ---------- */
.dfiles span { cursor: pointer; } .dfiles span:hover, .dfiles span.on { border-color: #a5b4fc; color: #fff; }
#pop { position: fixed; z-index: 55; width: min(640px, 90vw); max-height: 62vh; display: none; flex-direction: column; background: #0d0f17; border: 2px solid #a5b4fc;
  box-shadow: 6px 6px 0 #000, 0 0 30px #6366f144; border-radius: 4px; }
#pop.open { display: flex; }
#pop .ph { display: flex; gap: 8px; align-items: baseline; padding: 6px 10px; background: #161d36; border-bottom: 2px solid #26335c; }
#pop .ph span { color: var(--dim); font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
#pop .ph .sum { flex: none; } #pop .a { color: #4ade80; } #pop .r { color: #f87171; }
#pop .ph button { background: none; border: 2px solid #26335c; color: var(--dim); font-size: 10px; }
#pop .pb { overflow: auto; padding: 4px 0 8px; font-size: 12px; }
#pop .hh { color: #818cf8; font-size: 10px; padding: 8px 10px 2px; }
#pop .dl { white-space: pre; padding: 0 10px; color: #a1a1aa; min-height: 1.4em; } #pop .dl i { display: inline-block; width: 2ch; font-style: normal; color: #52525b; }
#pop .dl.add { background: #052e1680; color: #bbf7d0; } #pop .dl.add i { color: #4ade80; }
#pop .dl.del { background: #450a0a80; color: #fecaca; } #pop .dl.del i { color: #f87171; }
#pop .pf { color: #5b6285; font-size: 10px; padding: 4px 10px; border-top: 1px solid #1f2a4d; }


/* ---------- hangar stack, CI on the ship, selection, telemetry ---------- */
.sstack { position: absolute; left: 0; top: 0; width: 140px; height: 88px; cursor: pointer; z-index: 4; transition: transform 1s; }
.sstack img { position: absolute; width: 56px; height: 56px; }
.sstack img:nth-child(1) { left: 0; top: 14px; } .sstack img:nth-child(2) { left: 22px; top: 6px; } .sstack img:nth-child(3) { left: 44px; top: 0; }
.sstack b { position: absolute; left: 0; top: 64px; width: 140px; font-size: 11px; color: var(--done); text-shadow: 1px 1px 0 #000; }
.sstack small { position: absolute; left: 104px; top: 22px; font: 16px Silkscreen, monospace; color: #e0e7ff; text-shadow: 2px 2px 0 #000; }
.sstack:hover b { text-decoration: underline; }
.srobot.stacking { opacity: 0; transition: transform .8s, opacity .8s; pointer-events: none; }
.srobot .tag { left: -5px !important; width: 74px !important; overflow: hidden; text-overflow: ellipsis; font-size: 10.5px; }
.srobot.ci-green .ab { border-color: var(--done); color: var(--done); }
.srobot.ci-red .ab { border-color: var(--need); color: var(--need); background: #2a0a17; }
.srobot.ci-run .ab, .srobot.ci-wait .ab { border-color: var(--working); color: var(--working); }
.srobot.stopped .body { filter: grayscale(1) brightness(.7); } .srobot.stopped .ab { border-color: var(--idle); color: var(--idle); }
.srobot.sel::after, .robot.sel::after { content: ''; position: absolute; left: -6px; top: -8px; width: 76px; height: 92px; border: 2px dashed #e0e7ff; border-radius: 6px; pointer-events: none; animation: blink 1.2s infinite; }
#selbar { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); z-index: 45; display: flex; gap: 8px; align-items: center; padding: 6px 10px;
  background: #0c1326f2; border: 2px solid #e0e7ff; border-radius: 4px; box-shadow: 4px 4px 0 #000; }
#selbar[hidden] { display: none; }
#selbar b { color: #fff; margin-right: 4px; }
#selbar button { background: #18213f; border: 2px solid #26335c; color: var(--ink); padding: 2px 8px; border-radius: 2px; font-weight: 700; }
#selbar button.go { background: #14532d; border-color: var(--done); color: #dcfce7; } #selbar button.stop { border-color: #7f1d1d; color: #fecaca; }
#selbar button:disabled { opacity: .35; cursor: default; }
#selbar small { color: var(--dim); }
.chip.telem { color: #c4b5fd; cursor: help; white-space: nowrap; }
#st-tether line.dep { stroke: #94a3b8; stroke-dasharray: 2 6; animation: none; }
#st-tether text { fill: #cbd5e1; font: 10px 'JetBrains Mono', monospace; paint-order: stroke; stroke: #000; stroke-width: 3px; }
.dhead .ctx { color: #c4b5fd; font-size: 11px; white-space: nowrap; }


/* ---------- attention layout ---------- */
.room-fly { background: linear-gradient(#18213f 1px, transparent 1px) 0 0 / 100% 24px, linear-gradient(90deg, #18213f 1px, transparent 1px) 0 0 / 24px 100%, linear-gradient(#0f1a33, #0e1529); }
.room-stuck { background: repeating-linear-gradient(135deg, #1a1d2e 0 10px, #141726 10px 20px); }
.room-stuck.lit { box-shadow: inset 0 0 0 2px #64748b55, inset 0 50px 50px -34px #c7d2fe22; }
.bridge.calm-alert { border-color: #a5b4fc; box-shadow: 0 0 0 3px #0b0d22, 0 0 34px #a5b4fc33 inset; }
#bridge-list { position: absolute; left: 0; top: 0; z-index: 8; }
#bridge-list .xhead { display: flex; align-items: center; gap: 8px; font: 11px Silkscreen, monospace; color: #c7d2fe; letter-spacing: 1px; margin-bottom: 3px; }
#bridge-list .xhead small { font: 10px 'JetBrains Mono', monospace; color: var(--dim); letter-spacing: 0; }
#bridge-list .xhead button { margin-left: auto; }
#bridge-list button { background: #18213f; border: 2px solid #26335c; color: var(--ink); padding: 0 8px; border-radius: 2px; font-size: 11px; font-weight: 700; white-space: nowrap; }
#bridge-list button.go, #bridge-list .ready button[data-x="merge"] { background: #14532d; border-color: var(--done); color: #dcfce7; }
#bridge-list .xrow { display: flex; align-items: center; gap: 8px; height: 24px; padding: 0 6px; border-left: 3px solid var(--idle); background: #0b0d22cc; margin-bottom: 0; cursor: pointer; }
#bridge-list .xrow:hover { background: #18213f; }
#bridge-list .xrow b { white-space: nowrap; } #bridge-list .xrow .xi { width: 16px; text-align: center; }
#bridge-list .xrow .xt { flex: 1; min-width: 0; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#bridge-list .xrow.need { border-left-color: var(--need); } #bridge-list .xrow.red { border-left-color: var(--need); }
#bridge-list .xrow.ready { border-left-color: var(--done); } #bridge-list .xrow.stuck { border-left-color: #94a3b8; }
#bridge-list .xmore { color: var(--dim); font-size: 11px; padding: 2px 8px; }
/* ---------- ship's log ---------- */
#log { position: fixed; left: 16px; bottom: 12px; width: 460px; z-index: 25; background: #0c1326f2; border: 2px solid var(--card-edge); border-radius: 4px; box-shadow: 4px 4px 0 #000; }
#log .lh { display: flex; gap: 8px; align-items: center; padding: 3px 8px; border-bottom: 1px solid #26335c; }
#log .lh b { font: 12px Silkscreen, monospace; letter-spacing: 1px; color: #c7d2fe; } #log .lc { color: var(--dim); font-size: 11px; flex: 1; }
#log .lh button { background: none; border: 0; color: var(--dim); }
#log .lb { max-height: 196px; overflow: auto; padding: 2px 0; }
#log.min .lb, #log.min .lf { display: none; } #log.min .lh { border-bottom: 0; }
#log .lf { color: var(--faint); font-size: 10px; padding: 2px 8px 3px; border-top: 1px solid #1b2340; }
.ev { display: flex; gap: 7px; padding: 1px 8px; font-size: 11px; cursor: pointer; white-space: nowrap; overflow: hidden; }
.ev:hover { background: #18213f; } .ev time { color: var(--faint); } .ev i { font-style: normal; width: 14px; text-align: center; color: var(--dim); }
.ev span { overflow: hidden; text-overflow: ellipsis; color: #cbd5e1; } .ev b { color: #e0e7ff; }
.ev.ok i { color: var(--done); } .ev.bad i { color: var(--need); } .ev.warn i { color: #c4b5fd; } .ev.you i { color: #f0abfc; }
.ev.new, .tick.new { animation: evnew 1.6s ease-out; }
#log .lh { cursor: pointer; } #log.min { width: 520px; } #log .lc { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tick i { font-style: normal; } .tick.ok i { color: var(--done); } .tick.bad i { color: var(--need); } .tick.warn i { color: #c4b5fd; } .tick.you i { color: #f0abfc; } .tick b { color: #e0e7ff; }
@keyframes evnew { 0% { background: #4338ca88; } 100% { background: transparent; } }


#bridge-list .xn { font: 10px 'JetBrains Mono', monospace; color: #e0e7ff; background: #000; border: 1px solid #4b5563; border-radius: 2px; padding: 0 3px; }
/* docks rest dim; decks with crew stand out */
.docks { opacity: .5; filter: saturate(.6); transition: opacity .3s, filter .3s; }
.docks:hover { opacity: 1; filter: none; }
/* a hangar with a green PR waiting glows: a merge is ready */
.deck .room-hangar.ready { animation: hangarReady 2.6s ease-in-out infinite; }
@keyframes hangarReady { 0%, 100% { box-shadow: inset 0 0 0 2px #4ade8033, inset 0 -40px 60px -30px #4ade8022; } 50% { box-shadow: inset 0 0 0 2px #4ade8099, inset 0 -60px 70px -24px #4ade8055; } }
.deck .room-hangar.ready .rcount { color: var(--done); }

/* ---------- life ---------- */
#station { animation: drift 260s linear infinite; }
@keyframes drift { to { background-position: -1800px 0, -2300px 0, -3100px 0, 0 0; } }
.deck .room { transition: filter .9s, box-shadow .9s; filter: brightness(.42) saturate(.45); }
.deck .room.lit { filter: none; box-shadow: inset 0 50px 50px -34px #c7d2fe33; }
.srobot .fx { position: absolute; left: 0; top: 0; width: 64px; height: 64px; pointer-events: none; z-index: 2; }
.srobot.in-shop.working .fx::before { content: ''; position: absolute; left: 50px; top: 30px; width: 2px; height: 2px; background: #fff;
  box-shadow: 3px -3px #f9a8d4, -2px -4px #fff, 5px 1px #f472b6, 1px -6px #fbcfe8, -4px 0 #f0abfc; animation: spark .45s steps(3) infinite; }
.srobot.in-shop.working .fx::after { content: ''; position: absolute; left: 47px; top: 33px; width: 2px; height: 2px; background: #f9a8d4;
  box-shadow: -3px 2px #fff, 4px 3px #f472b6; animation: spark .45s .22s steps(3) infinite; }
@keyframes spark { 0% { transform: scale(.4); opacity: 1; } 100% { transform: scale(2.4) translate(2px, -3px); opacity: 0; } }
.srobot.in-lib.working .fx::before, .srobot.in-lib.working .fx::after { content: '▤'; position: absolute; left: 44px; top: 6px; color: #e0e7ff; font-size: 10px; animation: float 2.2s ease-out infinite; }
.srobot.in-lib.working .fx::after { left: 8px; top: 12px; font-size: 9px; color: #c7d2fe; animation-delay: 1.1s; }
@keyframes float { 0% { transform: translate(0, 0); opacity: 0; } 20% { opacity: .9; } 100% { transform: translate(6px, -34px); opacity: 0; } }
.srobot.in-lab.working .fx::before, .srobot.in-lab.working .fx::after { content: ''; position: absolute; left: 46px; top: 26px; width: 5px; height: 5px; border-radius: 50%;
  border: 1px solid #a5f3fc; background: #22d3ee33; animation: rise 1.6s ease-in infinite; }
.srobot.in-lab.working .fx::after { left: 14px; width: 4px; height: 4px; animation-delay: .8s; }
@keyframes rise { 0% { transform: translateY(0); opacity: 0; } 15% { opacity: 1; } 100% { transform: translateY(-44px); opacity: 0; } }
.srobot.in-rest .fx::before, .srobot.in-rest .fx::after { content: 'z'; position: absolute; left: 44px; top: 2px; color: #c7d2fe; font: 10px Silkscreen, monospace; animation: float 2.8s ease-out infinite; }
.srobot.in-rest .fx::after { content: 'Z'; left: 50px; top: -4px; font-size: 13px; color: #a5b4fc; animation-delay: 1.4s; }
.srobot.in-hangar.working .fx::before { content: ''; position: absolute; left: 22px; top: 16px; width: 20px; height: 20px; border-radius: 50%; border: 2px solid #67e8f9; animation: ping 1.5s ease-out infinite; }
@keyframes ping { 0% { transform: scale(.3); opacity: 1; } 100% { transform: scale(2.6); opacity: 0; } }
.srobot .ship { position: absolute; left: 52px; top: 4px; width: 64px; height: 64px; display: none; z-index: 0; transition: transform 2s cubic-bezier(.5, 0, .9, .4); }
.srobot.done.has-pr .ship, .srobot.launch .ship { display: block; }
.srobot.launch .ship { transform: translate(90px, -360px); }
.srobot.launch .body, .srobot.launch .acc, .srobot.launch .halo, .srobot.launch .tag, .srobot.launch .fx { opacity: 0; transition: opacity .4s; }
.tele { position: absolute; left: 0; top: 0; width: 64px; height: 64px; pointer-events: none; z-index: 5; animation: tele 1.4s ease-out forwards; transform-origin: bottom; }
@keyframes tele { 0% { opacity: 0; scale: 1 .2; } 25% { opacity: 1; scale: 1 1.15; } 100% { opacity: 0; scale: 1 1; } }
.srobot.idle .body { animation: breathe 3.2s ease-in-out infinite; }
@keyframes breathe { 50% { transform: translateY(1px); } }
.snexus .pact { background: #0e749055; border-color: #22d3ee; color: #cffafe; box-shadow: 0 0 10px #22d3ee55; }
@keyframes walk { 50% { transform: translateY(-3px) rotate(-3deg); } }
@keyframes walkf { 0%, 100% { transform: scaleX(-1); } 50% { transform: scaleX(-1) translateY(-3px) rotate(3deg); } }
@keyframes blink { 50% { opacity: .3; } }
@keyframes dash { to { stroke-dashoffset: -8; } }

@keyframes pulse { 50% { opacity: .55; } }
@keyframes bob { 50% { transform: translateY(-2px); } }
@keyframes beam { 0% { opacity: 0; transform: translateY(-40px) scaleY(1.6); filter: brightness(3); } 60% { opacity: 1; filter: brightness(1.6); } }
@keyframes flash { 50% { filter: brightness(1.8) drop-shadow(0 0 8px #fb7185); } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>

<header class="top">
  <div class="brand">NEXUS</div>
  <div class="chips">
    <span class="chip working" id="c-working">⚙ 0 working</span>
    <span class="chip need zero" id="c-need" title="click: triage what needs you">! 0 need you</span>
    <span class="chip done" id="c-done">✓ 0 ready</span>
    <span class="chip telem" id="c-tele">⚡ —</span>
  </div>
  <div class="replay">
    <button id="play" title="space">▶</button>
    <select id="speed"><option value="30">30×</option><option value="120" selected>120×</option><option value="600">600×</option></select>
    <input type="range" id="scrub" step="30">
    <span id="clock"></span>
    <button id="live">live</button>
    <div class="lay"><button id="lay-station">station</button><button id="lay-attn" class="on">attention</button><button id="lay-grid">grid</button></div>
    <button id="sim" title="a working child stops on a question or a permission">simulate a block</button>
  </div>
</header>
<main id="world" style="display:none"></main>
<div id="station"><div id="st-inner"><div id="st-bg"></div><svg id="st-tether"></svg><div id="st-hover" class="sbubble hide"></div></div></div>
<div id="fx"></div>
<aside id="drawer"><div class="dresize" title="arraste para redimensionar"></div><div class="dtabs"></div><div class="dpanes"></div></aside>
<button id="dhandle" hidden title="⌘\ or click: open the drawer"></button>
<div id="pop"></div>
<div id="selbar" hidden></div>
<div id="triage" hidden><div class="tri-card"></div></div>
<aside id="log" class="min"><div class="lh" data-logtoggle><b>SHIP'S LOG</b><span class="lc"></span><button title="expand / collapse">▸</button></div><div class="lb"></div><div class="lf">prototype · the real fleet (36 h of transcripts) · the drawer imitates the terminal</div></aside>

<script>window.onerror = (m, src, line) => { document.body.dataset.err = m + ' @' + line; console.error('PAGE-ERR', m, line) }</script>
<script src="fleet.js"></script>
<script>
'use strict'
const F = window.FLEET
const SP = '../../../../src/nexus/sprites/'
const WORK_GAP = 150          // seconds without a new action before a session counts as idle
const LINGER = 40 * 60        // a finished child stays on the floor this long
const $ = (s, el = document) => el.querySelector(s)
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]))
const upto = (arr, T) => { let lo = 0, hi = arr.length; while (lo < hi) { const m = (lo + hi) >> 1; if (arr[m] <= T) lo = m + 1; else hi = m } return lo - 1 }
const hash = (s) => { let h = 7; for (const ch of s) h = (h * 31 + ch.charCodeAt(0)) >>> 0; return h }
const firstSentence = (s, n = 160) => { const t = String(s || '').replace(/[*`#|]/g, '').trim(); const m = t.match(/^(.{20,}?[.!?:])\s/); const r = m ? m[1] : t; return r.length > n ? r.slice(0, n - 1) + '…' : r }
const ago = (s) => s < 60 ? `${Math.round(s)}s` : s < 3600 ? `${Math.round(s / 60)} min` : `${(s / 3600).toFixed(1)} h`

/* ---------- index the fleet ---------- */
const byId = new Map()
for (const p of F.parents) { p.kind = 'parent'; p.ats = p.log.map((e) => e.at); byId.set(p.id, p) }
for (const c of F.children) { c.kind = 'child'; c.ats = c.log.map((e) => e.at); c.tats = c.timeline.map((e) => e.at); byId.set(c.id, c) }
const parentIds = new Set(F.parents.map((p) => p.id))
const childIds = new Set(F.children.map((c) => c.id))
for (const c of F.children) {
  let p = c.parent, via = null, guard = 0
  while (p && childIds.has(p) && guard++ < 5) { via = via || byId.get(p); p = byId.get(p).parent }
  if (!p || !parentIds.has(p)) {
    const oid = 'orphan:' + c.repo
    if (!byId.has(oid)) {
      const o = { id: oid, short: '—', name: 'no parent', repo: c.repo, live: false, status: 'dead', klass: 'unknown', log: [], ats: [], first: 0, last: 0, kind: 'parent', orphan: true }
      F.parents.push(o); byId.set(oid, o); parentIds.add(oid)
    }
    p = oid
  }
  c.station = p; c.via = via
}
// twins under one station share an issue: suffix them a, b, …
const twinGroups = {}
for (const c of F.children) if (c.issue) (twinGroups[c.station + c.issue] ||= []).push(c)
for (const g of Object.values(twinGroups)) if (g.length > 1) g.sort((a, b) => a.first - b.first).forEach((c, i) => { c.twin = 'abcdefgh'[i] })

/* ---------- state at time T ---------- */
const sim = { needs: [], sent: new Map() }
const needOf = (id) => sim.needs.find((n) => n.id === id)
const sentOf = (id) => { const x = sim.sent.get(id); return x && performance.now() - x.at < 5000 ? x : null }
function lastOf(x, i, kind, depth = 80) { for (let k = i; k >= 0 && k > i - depth; k--) if (x.log[k].k === kind) return x.log[k]; return null }
const mergedAtOf = (c) => c.simMergeAt || (c.pr && c.pr.mergedAt) || null
function ciAt(pr, T) {
  if (!pr || !pr.checks || !pr.checks.length) return null
  if (!pr.checks.some((k) => k[0] && k[0] <= T)) return 'wait'
  if (pr.checks.some((k) => !k[1] || k[1] > T)) return 'run'
  return pr.checks.some((k) => /FAIL|ERROR|CANCEL|TIMED/i.test(k[2] || '')) ? 'red' : 'green'
}
function childAt(c, T) {
  if (c.first > T) return null
  const end = c.live ? Infinity : c.last
  const mergedAt = mergedAtOf(c), closedAt = c.pr && c.pr.state === 'CLOSED' ? c.pr.closedAt : null
  if (mergedAt && T >= mergedAt) return null
  if (closedAt && T >= closedAt) return null
  if (c.simStopAt && T > c.simStopAt + 120) return null
  if (!(c.pr && c.pr.state) && T > end + LINGER) return null
  const i = upto(c.ats, T), ti = upto(c.tats, T)
  const lastAct = Math.max(i >= 0 ? c.ats[i] : c.first, ti >= 0 ? c.tats[ti] : 0)
  let st
  // a tool call still waiting for its result is a long command running (CI watch, a full suite), not a stop
  const running = i >= 0 && c.log[i].k === 'tool' && T - c.ats[i] < 3 * 3600
  if (needOf(c.id)) st = 'need'
  else if (c.simStopAt && T >= c.simStopAt) st = 'stopped'
  else if (T > end + 60) st = 'done'
  else if (T - lastAct <= WORK_GAP || running) st = 'working'
  else st = 'idle'
  const tool = lastOf(c, i, 'tool', 40)
  const tally = {}
  for (let k = i; k >= 0 && c.ats[k] > T - ROOM_WINDOW; k--) if (c.log[k].k === 'tool') { const r = roomOfTool(c.log[k]); tally[r] = (tally[r] || 0) + 1 }
  const ranked = Object.entries(tally).sort((a, b) => b[1] - a[1])
  const room = ranked.length ? ranked[0][0] : tool ? roomOfTool(tool) : 'lib'
  return { st, i, detail: ti >= 0 ? c.timeline[ti].t : '', tool, say: lastOf(c, i, 'say'), idleFor: T - lastAct, room, ci: ciAt(c.pr, T), longRun: st === 'working' && running && T - lastAct > WORK_GAP }
}
function parentAt(p, T) {
  if (p.orphan) return { st: 'ghost', i: -1 }
  if (p.first && p.first > T) return null
  const i = upto(p.ats, T)
  const lastAct = i >= 0 ? p.ats[i] : p.first || 0
  let st = T - lastAct <= WORK_GAP ? 'busy' : 'idle'
  if (!p.live && T > (p.last || 0) + 900) st = 'dead'
  return { st, i, topic: lastOf(p, i, 'user', 600), say: lastOf(p, i, 'say', 30), tool: lastOf(p, i, 'tool', 15), idleFor: T - lastAct }
}
const ICON = { Bash: '⌘', Edit: '✎', Write: '✎', MultiEdit: '✎', Read: '◉', Grep: '⌕', Glob: '⌕', Agent: '⇢', Task: '⇢', WebFetch: '◎', WebSearch: '◎', TodoWrite: '☑', Skill: '★', SendMessage: '✉', Monitor: '◷', AskUserQuestion: '?' }
const human = (e) => e ? `${ICON[e.n] || '⚙'} ${e.n} · ${e.t}` : ''

function view(T) {
  const terr = new Map()
  const counts = { working: 0, need: 0, done: 0 }
  for (const p of F.parents) {
    const s = parentAt(p, T)
    if (!s) continue
    const t = terr.get(p.repo) || { repo: p.repo, stations: [], quiet: [], score: 0 }
    terr.set(p.repo, t)
    t.stations.push({ p, s, crew: [] })
  }
  for (const c of F.children) {
    const s = childAt(c, T)
    if (!s) continue
    const p = byId.get(c.station)
    const t = terr.get(p.repo)
    const st = t && t.stations.find((x) => x.p.id === p.id)
    if (!st) continue
    st.crew.push({ c, s })
    counts[s.st] = (counts[s.st] || 0) + 1
  }
  for (const t of terr.values()) {
    const active = [], quiet = []
    for (const st of t.stations) {
      st.need = st.crew.some((r) => r.s.st === 'need')
      st.crew.sort((a, b) => a.c.first - b.c.first)
      if (st.crew.length || st.s.st === 'busy') active.push(st)
      else if (st.s.st !== 'dead' && st.s.st !== 'ghost') quiet.push(st)
    }
    active.sort((a, b) => (b.need - a.need) || (b.crew.filter((r) => r.s.st === 'working').length - a.crew.filter((r) => r.s.st === 'working').length) || (b.s.st === 'busy') - (a.s.st === 'busy'))
    t.stations = active; t.quiet = quiet
    t.score = active.reduce((n, st) => n + (st.need ? 1000 : 0) + st.crew.length * 10 + (st.s.st === 'busy' ? 5 : 0), 0)
  }
  const list = [...terr.values()].filter((t) => t.stations.length || t.quiet.length).sort((a, b) => b.score - a.score || a.repo.localeCompare(b.repo))
  return { list, counts }
}

/* ---------- render ---------- */
const robotPose = { working: 'working', idle: 'idle', need: 'waiting', done: 'idle', stopped: 'sleeping' }
const nexusPose = { busy: 'busy', idle: 'idle', dead: 'dead', ghost: 'dead' }
const captainSrc = (p, st, need) => p.orphan ? `${SP}chair.png` : `${SP}captain-${need ? 'alert' : { busy: 'busy', idle: 'idle', dead: 'offline', ghost: 'offline' }[st] || 'idle'}.png`
const world = $('#world')
let lastSig = ''
function tagOf(c) { return `${esc(c.issue || c.short)}${c.twin ? '·' + c.twin : ''}${c.via ? ` <span class="via">↳${esc(c.via.issue || c.via.short)}</span>` : ''}` }

function bubbleHTML(c, s, T) {
  if (s.st === 'need') {
    const n = needOf(c.id)
    if (n.kind === 'perm') return `<div class="bubble need" data-need data-for="${c.id}"><div class="q">🔒 wants to run:</div><div>${esc(n.text)}</div>
      <div class="opts"><button class="go" data-reply="approved">approve</button><button data-reply="denied">deny</button></div>
      <div class="link" data-open>open terminal ⤢</div></div>`
    return `<div class="bubble need" data-need data-for="${c.id}"><div class="q">❓ ${esc(n.text)}</div>
      <div class="opts">${n.options.map((o, k) => `<button class="${k === 0 ? 'go' : ''}" data-reply="${esc(o)}">${esc(o)}</button>`).join('')}</div>
      <form data-form><input placeholder="or type the answer…" data-input><button>↩</button></form>
      <div class="link" data-open>open terminal ⤢</div></div>`
  }
  if (sentOf(c.id)) return `<div class="bubble sent"><div class="say">↩ you: ${esc(sentOf(c.id).text)}</div></div>`
  let say, act = human(s.tool)
  if (s.st === 'done') { say = (c.pr ? `✓ ready · PR #${c.pr.id}` : '✓ finished') + (s.say ? ' — ' + firstSentence(s.say.t, 110) : ''); act = '' }
  else say = s.detail || (s.say ? firstSentence(s.say.t) : human(s.tool))
  if (s.st === 'idle') act = `… idle for ${ago(s.idleFor)}` + (s.tool ? ` · last: ${s.tool.n}` : '')
  const more = `${esc(c.title)}<br>${esc(c.model || 'model ?')} · ${c.tokens ? Math.round(c.tokens / 1000) + 'k ctx' : ''}${s.say && s.st !== 'done' ? '<br>💬 ' + esc(firstSentence(s.say.t, 220)) : ''}`
  return `<div class="bubble"><div class="say">${esc(say)}</div>${act ? `<div class="act">${esc(act)}</div>` : ''}<div class="more">${more}</div></div>`
}
function nexusBubble(p, s) {
  if (s.st !== 'busy') return ''
  const say = s.tool && (!s.say || s.tool.at >= s.say.at) ? human(s.tool) : s.say ? firstSentence(s.say.t) : ''
  return say ? `<div class="bubble"><div class="say">${esc(say)}</div></div>` : ''
}

function renderGrid(T) {
  const { list, counts } = view(T)
  $('#c-working').textContent = `⚙ ${counts.working || 0} working`
  $('#c-need').textContent = `! ${counts.need || 0} need${counts.need === 1 ? 's' : ''} you`
  $('#c-need').classList.toggle('zero', !counts.need)
  $('#c-done').textContent = `✓ ${counts.done || 0} ready`
  // A tree of strings; the DOM is rebuilt only when who-is-where changes, otherwise each piece is
  // patched in place, so hover, a typed reply and the beam-in animation survive the clock.
  const tree = list.map((t) => {
    const kids = t.stations.reduce((n, st) => n + st.crew.length, 0), sess = t.stations.length + t.quiet.length
    return {
      key: t.repo, cls: `terr ${t.stations.length ? '' : 'quiet-only'}`,
      head: `${esc(t.repo)} <small>${kids} child${kids === 1 ? '' : 'ren'} · ${sess} session${sess === 1 ? '' : 's'}</small>`,
      stations: t.stations.map((st) => {
        const p = st.p, s = st.s, mail = recentMail(p, T)
        return {
          key: p.id, cls: `nexus ${s.st} ${st.need ? 'has-need' : ''} ${p.id === focusId() ? 'focus' : ''}`,
          nexus: `<div class="ring"></div><img class="sprite" src="${captainSrc(p, s.st, st.need)}" alt="">
            ${mail ? `<div class="mail" title="notices from children (30 min)">✉ ${mail}</div>` : ''}
            <div class="name">${esc(p.name)}</div>
            <div class="topic">${p.orphan ? 'children with no recorded parent' : s.topic ? '“' + esc(s.topic.t.slice(0, 90)) + '”' : ''}</div>${nexusBubble(p, s)}`,
          robots: st.crew.map(({ c, s }) => ({
            key: c.id, cls: `robot ${s.st} ${c.id === focusId() ? 'focus' : ''} ${sel.has(c.id) ? 'sel' : ''}`,
            inner: `${bubbleHTML(c, s, T)}<div class="halo"></div><img class="acc" src="${SP}accessory-${hash(c.id) % 6}.png" alt="">
              <img class="body" src="${SP}robot-${c.klass}-${robotPose[s.st]}.png" alt=""><div class="tag">${tagOf(c)}</div>`,
            title: c.title,
          })),
        }
      }),
      quiet: t.quiet.length ? `<span>idle:</span>${t.quiet.map((st) => `<button class="qchip" data-id="${st.p.id}" title="${esc(st.s.topic ? st.s.topic.t.slice(0, 200) : '')}"><img src="${SP}captain-idle.png" alt="">${esc(st.p.name)}</button>`).join('')}` : '',
    }
  })
  const sig = JSON.stringify(tree.map((t) => [t.key, !!t.quiet, t.stations.map((s) => [s.key, s.robots.map((r) => r.key)])]))
  const set = (el, prop, v) => { if (el['_' + prop] !== v) { el['_' + prop] = v; if (prop === 'cls') el.className = v; else el.innerHTML = v } }
  if (sig !== lastSig) {
    const inp = $('[data-input]'), typed = inp ? inp.value : '', hadFocus = inp && document.activeElement === inp
    world.innerHTML = tree.map((t) => `<section data-terr="${esc(t.key)}"><h2></h2>${t.stations.map((s) => `<div class="station"><div data-id="${s.key}"></div><div class="crew">${
      s.robots.length ? s.robots.map((r) => `<div data-id="${r.key}" title="${esc(r.title)}"></div>`).join('') : '<div class="empty">no children right now</div>'}</div></div>`).join('')}${t.quiet ? '<div class="quiet"></div>' : ''}</section>`).join('')
    lastSig = sig
    for (const id of spawned) { const el = world.querySelector(`.crew [data-id="${CSS.escape(id)}"]`); if (el) { el.style.animation = 'beam .9s ease-out'; setTimeout(() => (el.style.animation = ''), 950) } }
    queueMicrotask(() => { const ni = $('[data-input]'); if (ni) { ni.value = typed; if (hadFocus) ni.focus() } })
  }
  spawned.clear()
  const secs = world.children
  tree.forEach((t, i) => {
    const sec = secs[i]
    set(sec, 'cls', t.cls); set(sec.firstElementChild, 'html', t.head)
    const stEls = sec.querySelectorAll(':scope > .station')
    t.stations.forEach((s, j) => {
      const nx = stEls[j].firstElementChild
      set(nx, 'cls', s.cls); set(nx, 'html', s.nexus)
      const rEls = stEls[j].querySelectorAll('.crew > [data-id]')
      s.robots.forEach((r, k) => { set(rEls[k], 'cls', r.cls); set(rEls[k], 'html', r.inner) })
    })
    if (t.quiet) set(sec.querySelector('.quiet'), 'html', t.quiet)
  })
  for (const w of wins.values()) paintWin(w, T)
}

/* ---------- mail & flights ---------- */
function recentMail(p, T) { let n = 0; for (let k = upto(p.ats, T); k >= 0 && p.ats[k] > T - 1800; k--) if (p.log[k].k === 'peer') n++; return n }
const spawned = new Set()
function rectOf(id) { const el = document.querySelector(`[data-id="${CSS.escape(id)}"] .body, [data-id="${CSS.escape(id)}"] .sprite`); return el && el.getBoundingClientRect() }
function fly(fromRect, toRect, glyph, cls = '') {
  if (!fromRect || !toRect) return
  const el = document.createElement('div')
  el.className = 'env ' + cls; el.textContent = glyph
  $('#fx').appendChild(el)
  const a = { x: fromRect.left + fromRect.width / 2 - 9, y: fromRect.top }, b = { x: toRect.left + toRect.width / 2 - 9, y: toRect.top + 20 }
  el.animate([
    { transform: `translate(${a.x}px, ${a.y}px) scale(.6)`, opacity: 0 },
    { transform: `translate(${(a.x + b.x) / 2}px, ${Math.min(a.y, b.y) - 70}px) scale(1.3)`, opacity: 1, offset: .5 },
    { transform: `translate(${b.x}px, ${b.y}px) scale(.8)`, opacity: .9 },
  ], { duration: 1400, easing: 'ease-in-out' }).onfinish = () => el.remove()
}
function events(prevT, T) {
  if (T <= prevT || T - prevT > 3 * 3600) return
  for (const c of F.children) if (c.first > prevT && c.first <= T) spawned.add(c.id)
  const flights = []
  for (const p of F.parents) {
    for (let k = upto(p.ats, T); k >= 0 && p.ats[k] > prevT; k--) {
      const e = p.log[k]
      if (e.k === 'peer') {
        const kid = F.children.find((c) => c.station === p.id && e.t.includes(c.short))
        flights.push(() => fly(kid ? rectOf(kid.id) : null, rectOf(p.id), '✉'))
      } else if (e.k === 'tool' && e.n === 'SendMessage') {
        const kid = F.children.find((c) => c.station === p.id && childAt(c, T)?.st === 'working')
        if (kid) flights.push(() => fly(rectOf(p.id), rectOf(kid.id), '✉'))
      }
    }
  }
  requestAnimationFrame(() => flights.slice(0, 6).forEach((f) => f()))
}

/* ---------- drawer: one tab per open session; the ship stays visible beside it ---------- */
const wins = new Map()
let collapsed = false
const focusId = () => (!collapsed && activeId) || null
let activeId = null, DW = Math.round(Math.min(720, innerWidth * 0.42))
const drawer = $('#drawer')
function crumbs(x) {
  const sep = '<span class="sep">▸</span>'
  if (x.kind === 'child') {
    const p = byId.get(x.station)
    return `${esc(x.repo)}${sep}<a data-go="${p.id}">${emblemOf.get(p.id) || ''} ${esc(p.name)}</a>${x.via ? sep + `<a data-go="${x.via.id}">${esc(x.via.issue || x.via.short)}</a>` : ''}${sep}<b>${esc(x.issue || x.short)}${x.twin ? '·' + x.twin : ''}</b>`
  }
  const kids = F.children.filter((c) => c.station === x.id).length
  return `${esc(x.repo)}${sep}<b>${emblemOf.get(x.id) || ''} ${esc(x.name)}</b><span class="sep">·</span>${kids} child${kids === 1 ? '' : 'ren'} in these 36 h`
}
function layoutDrawer() {
  const open = wins.size > 0 && !collapsed
  drawer.classList.toggle('open', open)
  const h = $('#dhandle'); h.hidden = !(wins.size > 0 && collapsed)
  h.textContent = `⟨  ${wins.size} ${wins.size === 1 ? 'session open' : 'sessions open'}  ·  ⌘\\`
  if (!open) closePop()
  document.body.style.setProperty('--dw', `${DW}px`)
  document.body.style.setProperty('--dwopen', open ? `${DW}px` : '0px')
  setTimeout(() => { bgSig = ''; render(T) }, 260)
}
function openWin(id) {
  const x = byId.get(id)
  if (!x || x.orphan) return
  if (!wins.has(id)) {
    const isChild = x.kind === 'child'
    const tab = document.createElement('button')
    tab.className = 'dtab'
    tab.innerHTML = `<span class="dot"></span><img src="${isChild ? `${SP}robot-${x.klass}-working.png` : captainSrc(x, 'busy')}" alt=""><span>${esc(isChild ? (x.issue || x.short) + (x.twin ? '·' + x.twin : '') : x.name)}</span><span class="x" title="fechar (esc)">×</span>`
    const el = document.createElement('div')
    el.className = 'dpane'
    el.innerHTML = `<div class="dhead"><div class="crumbs">${crumbs(x)}</div><span class="ctx"></span><span class="st"></span><button data-pane title="in the app: becomes a normal tab">open as tab ⤢</button></div>
      <div class="dsub">${esc(isChild ? x.title : '“' + ((parentAt(x, T) || {}).topic?.t || '').slice(0, 160) + '”')}</div>
      <div class="dfiles"></div>
      <div class="term"></div>
      <div class="prompt"><span>&gt;</span><input placeholder="${isChild ? 'talk to the child (attach)…' : 'talk to the captain…'}"></div>
      <div class="foot">${isChild ? `in the app: claude attach ${x.short} — a live terminal you can type in` : 'in the app: the real terminal of this session, re-hosted here without killing its PTY'}</div>`
    $('.dtabs').appendChild(tab); $('.dpanes').appendChild(el)
