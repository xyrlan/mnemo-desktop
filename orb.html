<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>James</title>
    <!-- James's orb (src/jarvis/orb/main.ts): its own entry, with none of the app. The window is
         220 px square, transparent and click-through: the thread orb is drawn on the canvas, the
         word for what James is doing stands under it, then what was heard and what he says. -->
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: transparent;
        user-select: none;
        cursor: default;
      }
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        color: #fff;
        font: 400 12px/1.35 'Geist Variable', system-ui, 'Segoe UI', sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      #orb {
        flex: none;
        width: 146px;
        height: 146px;
      }
      /* What James is doing, as a word: Jura, as every name and number of the app. */
      #state {
        flex: none;
        margin-top: -9px;
        padding: 3px 9px 3px 11px;
        border: 1px solid rgb(255 255 255 / 0.22);
        border-radius: 99px;
        background: rgb(0 0 0 / 0.78);
        font: 600 9px/1 'Jura Variable', 'Geist Variable', system-ui, sans-serif;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        white-space: nowrap;
      }
      #state:empty {
        display: none;
      }
      #state[data-look='waiting'] {
        color: rgb(255 255 255 / 0.7);
      }
      #caption {
        width: 208px;
        text-align: center;
      }
      #caption div {
        width: fit-content;
        margin: 3px auto 0;
        padding: 1px 8px 2px;
        border: 1px solid rgb(255 255 255 / 0.12);
        border-radius: 4px;
        background: rgb(0 0 0 / 0.78);
        overflow: hidden;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
      }
      #caption .you {
        color: rgb(255 255 255 / 0.7);
      }
      /* What was heard steps back to one line once James answers under it: both fit the window. */
      #caption .you:not(:last-child) {
        -webkit-line-clamp: 1;
      }
    </style>
  </head>
  <body>
    <canvas id="orb"></canvas>
    <div id="state" role="status"></div>
    <div id="caption" aria-live="polite"></div>
    <script type="module" src="/src/jarvis/orb/main.ts"></script>
  </body>
</html>
