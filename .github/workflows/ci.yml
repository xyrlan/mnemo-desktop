name: ci
on:
  push:
    branches: [main]
  pull_request:
env:
  CARGO_TARGET_DIR: ${{ github.workspace }}/src-tauri/target
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev xvfb
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      # The bundles a release ships, checked for the helper binaries the app looks for beside
      # itself (scripts/bundle-helpers.mjs). Windows runs no terminal daemon or hook socket.
      - if: runner.os == 'macOS'
        run: pnpm tauri build --ci --bundles app
      - if: runner.os == 'Linux'
        run: pnpm tauri build --ci --bundles deb,appimage
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
      - if: runner.os == 'Windows'
        run: pnpm tauri build --ci --no-bundle
      - name: helpers in the bundle
        if: runner.os != 'Windows'
        run: node scripts/bundle-helpers.mjs
      - name: smoke (shell round-trip inside the built app)
        if: runner.os == 'Linux'
        run: MNEMO_DESKTOP_SMOKE=1 xvfb-run -a src-tauri/target/release/mnemo-desktop
      - name: smoke (shell round-trip inside the built app)
        if: runner.os == 'macOS'
        run: MNEMO_DESKTOP_SMOKE=1 src-tauri/target/release/mnemo-desktop
