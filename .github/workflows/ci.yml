name: ci
on:
  push:
    branches: [main]
  pull_request:
env:
  CARGO_TARGET_DIR: ${{ github.workspace }}/src-tauri/target
  # Built for other machines, not for the runner (#308): left alone, whisper's ggml tunes
  # itself to the CPU it is compiled on, and v0.5.0 for Windows came out needing AVX-512.
  GGML_NATIVE: 'OFF'
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      # cmake-rs replaces MSVC's Release flags with a line that has no /O flag unless they are
      # already defined, and whisper's build script forwards CMAKE_* from the environment (#312).
      # Before the cache: its key takes CMAKE_*, and a build restored from before stays as it was.
      - name: MSVC Release flags for whisper
        if: runner.os == 'Windows'
        shell: bash
        run: |
          echo "CMAKE_C_FLAGS_RELEASE=/MD /O2 /Ob2 /DNDEBUG" >> "$GITHUB_ENV"
          echo "CMAKE_CXX_FLAGS_RELEASE=/MD /O2 /Ob2 /DNDEBUG" >> "$GITHUB_ENV"
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # whisper's build script does not rerun when a GGML_* or CMAKE_* variable changes, so
          # a cache from before one did would keep the old build: the key has to change with it.
          env-vars: GGML CMAKE
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev xvfb
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      # The preview harness's own tests drive Chromium, so once, on Linux.
      - name: preview harness tests
        if: runner.os == 'Linux'
        run: |
          pnpm --dir tools/preview install --frozen-lockfile
          pnpm --dir tools/preview exec playwright install --with-deps chromium
          pnpm --dir tools/preview test
      - run: pnpm build
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      # The bundles a release ships, checked for the helper binaries the app looks for beside
      # itself (scripts/bundle-helpers.mjs). Windows runs no terminal daemon or hook socket.
      - if: runner.os == 'macOS'
        run: pnpm tauri build --ci --bundles app
      - if: runner.os == 'Linux'
        run: pnpm tauri build --ci --bundles deb,appimage
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
      # Bundled with what the release bundles (tauri.windows.conf.json): one installer, the
      # per-user NSIS setup.exe, and no MSI beside it to install mnemo a second time (#366).
      - if: runner.os == 'Windows'
        run: pnpm tauri build --ci
      - name: one Windows installer
        if: runner.os == 'Windows'
        shell: bash
        run: |
          ls -R src-tauri/target/release/bundle
          test "$(ls src-tauri/target/release/bundle)" = nsis
          ls src-tauri/target/release/bundle/nsis/*-setup.exe
      - name: helpers in the bundle
        if: runner.os != 'Windows'
        run: node scripts/bundle-helpers.mjs
      # What was built, not what was asked for: whisper's configuration and the executable.
      - name: built for other machines, and optimized
        run: node scripts/portable-build.mjs
      - name: smoke (shell round-trip inside the built app)
        if: runner.os == 'Linux'
        run: MNEMO_DESKTOP_SMOKE=1 xvfb-run -a src-tauri/target/release/mnemo-desktop
      - name: smoke (shell round-trip inside the built app)
        if: runner.os == 'macOS'
        run: MNEMO_DESKTOP_SMOKE=1 src-tauri/target/release/mnemo-desktop
      # Design Mode's crop and desktop_pane_snapshot take a picture of a real webview (#363):
      # WKWebView, WebView2 and WebKitGTK each have their own call. The built app takes one of its
      # own window, and fails when it gets no image.
      - name: smoke (snapshot of the built app's webview)
        if: runner.os == 'Linux'
        run: MNEMO_DESKTOP_SMOKE=snapshot xvfb-run -a src-tauri/target/release/mnemo-desktop
      - name: smoke (snapshot of the built app's webview)
        if: runner.os != 'Linux'
        shell: bash
        run: MNEMO_DESKTOP_SMOKE=snapshot src-tauri/target/release/mnemo-desktop
