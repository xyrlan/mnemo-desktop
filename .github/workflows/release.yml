name: release
on:
  push:
    tags: ['v*']
# The repo's default token is read-only; creating the release and uploading
# its assets needs write on contents.
permissions:
  contents: write
env:
  CARGO_TARGET_DIR: ${{ github.workspace }}/src-tauri/target
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --target aarch64-apple-darwin
          - os: macos-latest
            args: --target x86_64-apple-darwin
          - os: ubuntu-latest
            args: ''
          - os: windows-latest
            args: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev
      - run: pnpm install --frozen-lockfile
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: mnemo-desktop ${{ github.ref_name }}
          # A draft until every platform has uploaded: a job that fails must not
          # leave a public release with a platform missing. Publish by hand.
          releaseDraft: true
          args: ${{ matrix.args }}
