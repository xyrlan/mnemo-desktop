name: release
on:
  push:
    tags: ['v*']
# The repo's default token is read-only; creating the release and uploading
# its assets needs write on contents.
permissions:
  contents: write
env:
  CARGO_TARGET_DIR: ${{ github.workspace }}/src-tauri/target
  # Built for other machines, not for the runner (#308): left alone, whisper's ggml tunes
  # itself to the CPU it is compiled on, and v0.5.0 for Windows came out needing AVX-512.
  GGML_NATIVE: 'OFF'
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --target aarch64-apple-darwin
          - os: macos-latest
            args: --target x86_64-apple-darwin
          - os: ubuntu-latest
            args: ''
          - os: windows-latest
            args: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev
      # cmake-rs replaces MSVC's Release flags with a line that has no /O flag unless they are
      # already defined, and whisper's build script forwards CMAKE_* from the environment (#312).
      - name: MSVC Release flags for whisper
        if: runner.os == 'Windows'
        shell: bash
        run: |
          echo "CMAKE_C_FLAGS_RELEASE=/MD /O2 /Ob2 /DNDEBUG" >> "$GITHUB_ENV"
          echo "CMAKE_CXX_FLAGS_RELEASE=/MD /O2 /Ob2 /DNDEBUG" >> "$GITHUB_ENV"
      # Whisper on the GPU through Vulkan (voice.rs): the SDK that builds it, as in ci.yml.
      - name: Vulkan SDK
        if: runner.os == 'Windows'
        shell: bash
        env:
          VULKAN_SDK_VERSION: 1.4.363.0
          VULKAN_SDK_SHA256: 94a82d378f7a5e3e54c9db7d2fb7016af136e14ac0a18dbf0f2f67a36352d141
        run: |
          curl -fsSLo "$RUNNER_TEMP/vulkansdk.exe" "https://sdk.lunarg.com/sdk/download/$VULKAN_SDK_VERSION/windows/vulkansdk-windows-X64-$VULKAN_SDK_VERSION.exe"
          echo "$VULKAN_SDK_SHA256  $RUNNER_TEMP/vulkansdk.exe" | sha256sum -c -
          sdk="C:\\VulkanSDK\\$VULKAN_SDK_VERSION"
          "$RUNNER_TEMP/vulkansdk.exe" --root "$sdk" --accept-licenses --default-answer --confirm-command install copy_only=1
          echo "VULKAN_SDK=$sdk" >> "$GITHUB_ENV"
          echo "$sdk\\Bin" >> "$GITHUB_PATH"
      - run: pnpm install --frozen-lockfile
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: mnemo-desktop ${{ github.ref_name }}
          # A draft until every platform has uploaded: a job that fails must not
          # leave a public release with a platform missing. Publish by hand.
          releaseDraft: true
          args: ${{ matrix.args }}
      # After the upload, so it cannot stop one. The release is a draft until someone publishes
      # it, and this step failing on any platform is the reason not to.
      - name: built for other machines, and optimized
        run: node scripts/portable-build.mjs
