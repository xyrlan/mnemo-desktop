[package]
name = "mnemo-desktop"
version = "0.7.0"
edition = "2021"
rust-version = "1.80"
# Four binaries: the app, the desktop MCP server Claude Code starts (see src/mcp.rs), the hook
# command Claude Code runs on agent events (see src/agent_hooks.rs), and the daemon that keeps the
# terminals running while the app is closed (see src/pty.rs); the last three live in src/bin/.
default-run = "mnemo-desktop"

[lib]
name = "mnemo_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# The helpers are declared rather than left to cargo's `src/bin/` discovery because the bundle
# takes its binaries from here: undeclared, `tauri build` (cli 2.11) built all three but put only
# the daemon in mnemo.app. The app looks for each one beside its own executable, so each must ship
# in the bundle's binary directory; `scripts/bundle-helpers.mjs` checks that it does.
[[bin]]
name = "mnemo-desktop-mcp"
path = "src/bin/mnemo-desktop-mcp.rs"

[[bin]]
name = "mnemo-desktop-ptyd"
path = "src/bin/mnemo-desktop-ptyd.rs"

[[bin]]
name = "mnemo-desktop-hook"
path = "src/bin/mnemo-desktop-hook.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `unstable` unlocks `Manager::get_webview`, which the app's own webview is reached through (lib.rs,
# mcp.rs).
tauri = { version = "2", features = ["unstable"] }
serde = { version = "1", features = ["derive"] }
# `raw_value`: the app edits `~/.claude/settings.json` (agent_hooks.rs) and writes back every
# part it did not change as the text it read.
serde_json = { version = "1", features = ["raw_value"] }
portable-pty = "0.9"
# The screen and scrollback of each terminal, kept beside its PTY so a pane that reattaches gets
# them back (src/pty/screen.rs).
vt100 = "0.16"
log = "0.4"
env_logger = "0.11"

# Voice dictation (voice.rs): whisper.cpp transcription (its build needs cmake and libclang; on
# macOS it runs on Metal, below), microphone capture (ALSA headers, libasound2-dev, on Linux), and
# the first-use model download.
whisper-rs = { version = "0.16", features = ["log_backend"] }
cpal = "0.18"
ureq = "3"
# A voice note dropped on a pane (voice_file.rs): the Ogg container, and libopus, built from its
# vendored source with the cmake whisper-rs already needs, so no ffmpeg runs on any OS.
ogg = "0.9"
opus = "0.4"
# Plain C, no SIMD intrinsics: a note decodes in a tenth of a second without them, and an MSVC
# build that cmake-rs leaves unoptimized (#312) would otherwise put spilling 256-bit code in the
# executable for portable-build.mjs to count.
opusic-sys = { version = "0.7", features = ["no-simd"] }
tauri-plugin-dialog = "2"
# Vault map (vaultmap.rs): wakes the born watcher when pages appear, change or go.
notify = "8"
# Browser pane snapshots travel as base64 image content (mcp.rs).
base64 = "0.22"
# Installing mnemo (tools_install.rs): its release is a .tar.gz, checked against a .sha256.
tar = "0.4"
flate2 = "1"
sha2 = "0.10"
# Native OS notifications for agents (agent_hooks.rs), sent from Rust: the front calls a command.
tauri-plugin-notification = "2"

# The terminal daemon (src/bin/mnemo-desktop-ptyd.rs) leaves the app's session and holds a lock on
# its socket.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# An account's shared dirs are junctions, which need no privilege to make (accounts.rs). The
# process table and a pid's exit code are read from the system (procs.rs), and a process's name
# for what a closing window would end (pty/closing.rs). The time zone the Memory panel's times are
# read in (memory_feed.rs). `--version` prints into the terminal's console (console.rs), and a
# start that fails says so in a message box (crash.rs).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_Diagnostics_ToolHelp", "Win32_System_IO", "Win32_System_Ioctl", "Win32_System_Threading", "Win32_System_Time", "Win32_UI_WindowsAndMessaging"] }
# WebView2's own interfaces, at the versions wry uses, so the controller Tauri hands over is these
# crates' type: the app webview's browser keys (browser_keys.rs), and the app's snapshot through
# CapturePreview into a memory stream (mcp.rs).
webview2-com = "0.38"
windows-core = "0.61"
windows = { version = "0.61", features = ["Win32_System_Com", "Win32_UI_Shell"] }

# The app's snapshot through WebKitGTK's own, encoded by gdk-pixbuf (mcp.rs). The versions wry uses.
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "2.0"
gdk = "0.18"

# A start that fails says so in a dialog (crash.rs): before the app, or after it failed, there
# is no AppHandle for the dialog plugin to show one with. The plugin's own rfd, no new crate;
# Windows uses user32's message box instead.
[target.'cfg(not(windows))'.dependencies]
rfd = { version = "0.16", default-features = false }

# The app's snapshot through WKWebView's own (mcp.rs).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
# Completion handlers for WKWebView snapshots (mcp.rs).
block2 = "0.6"
# Dictation on the GPU: several times faster than the CPU (voice.rs). The Metal shaders are
# embedded as source and compiled on first use, so the build needs no Metal compiler.
whisper-rs = { version = "0.16", features = ["log_backend", "metal"] }

[dev-dependencies]
# Reads the voice test fixture.
hound = "3.5"
