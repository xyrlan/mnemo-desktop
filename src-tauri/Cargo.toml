[package]
name = "mnemo-desktop"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"

[lib]
name = "mnemo_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"
log = "0.4"
env_logger = "0.11"
