[package]
name = "mnemo-desktop"
version = "0.2.0"
edition = "2021"
rust-version = "1.80"
# Four binaries: the app, the desktop MCP server Claude Code starts (see src/mcp.rs), the hook
# command Claude Code runs on agent events (see src/agent_hooks.rs), and the daemon that keeps the
# terminals running while the app is closed (see src/pty.rs); the last three live in src/bin/.
default-run = "mnemo-desktop"

[lib]
name = "mnemo_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `unstable` unlocks `Window::add_child`, which browser panes use for child webviews.
tauri = { version = "2", features = ["unstable"] }
serde = { version = "1", features = ["derive"] }
# `raw_value`: the app edits `~/.claude/settings.json` (agent_hooks.rs) and writes back every
# part it did not change as the text it read.
serde_json = { version = "1", features = ["raw_value"] }
portable-pty = "0.9"
# The screen and scrollback of each terminal, kept beside its PTY so a pane that reattaches gets
# them back (src/pty/screen.rs).
vt100 = "0.16"
log = "0.4"
env_logger = "0.11"

# Voice dictation (voice.rs): whisper.cpp transcription (its build needs cmake and libclang),
# microphone capture (ALSA headers, libasound2-dev, on Linux), and the first-use model download.
whisper-rs = { version = "0.16", features = ["log_backend"] }
cpal = "0.18"
ureq = "3"
tauri-plugin-dialog = "2"
# Vault map (vaultmap.rs): wakes the born watcher when pages appear, change or go.
notify = "8"
# Browser pane snapshots travel as base64 image content (mcp.rs).
base64 = "0.22"
# Installing mnemo (tools_install.rs): its release is a .tar.gz, checked against a .sha256.
tar = "0.4"
flate2 = "1"
sha2 = "0.10"
# Native OS notifications for agents (agent_hooks.rs), sent from Rust: the front calls a command.
tauri-plugin-notification = "2"

# The terminal daemon (src/bin/mnemo-desktop-ptyd.rs) leaves the app's session and holds a lock on
# its socket.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Browser panes read the window's content layout to place child webviews (see browser.rs).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
# Completion handlers for WKWebView snapshots (mcp.rs).
block2 = "0.6"

[dev-dependencies]
# Reads the voice test fixture.
hound = "3.5"
